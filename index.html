/* ─── Library Page ─── */
const Library=({items,viewingItem,setViewingItem,onUpdate,onDelete,folderFilter,setFolderFilter,batchMode,setBatchMode,selectedIds,toggleBatchSelect,selectAll,onBatchDelete,allFolders,onBatchMoveFolder})=>{
  const [platFilter,setPlatFilter]=useState('all');
  const [tagFilter,setTagFilter]=useState('all');
  const [sort,setSort]=useState('date');
  const [showMoveMenu,setShowMoveMenu]=useState(false);
  const [tagsExpanded,setTagsExpanded]=useState(false);
  const allTags=[...new Set(items.flatMap(i=>i.tags))];

  const filtered=useMemo(()=>{
    let r=[...items];
    if(platFilter!=='all')r=r.filter(i=>i.platform===platFilter);
    if(tagFilter!=='all')r=r.filter(i=>i.tags.includes(tagFilter));
    if(sort==='date')r.sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(sort==='rating')r.sort((a,b)=>b.rating-a.rating);
    if(sort==='uses')r.sort((a,b)=>b.uses-a.uses);
    return r;
  },[items,platFilter,tagFilter,sort]);

  const chipBtn=(active,onClick,children)=>({
    padding:'4px 11px',borderRadius:20,fontSize:11.5,fontWeight:active?600:400,cursor:'pointer',transition:'all .15s ease',letterSpacing:'-.01em',
    background:active?'var(--accent)':'var(--surface)',color:active?'#fff':'var(--text-2)',
    border:active?'1px solid var(--accent)':'1px solid rgba(0,0,0,.08)',
  });

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Filter bar */}
      <div style={{padding:'10px 20px',borderBottom:'0.5px solid rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:6,flexShrink:0,flexWrap:'wrap'}}>
        {folderFilter&&(
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 10px',background:'var(--accent-bg)',borderRadius:20,border:'1px solid var(--accent-border)'}}>
            <span style={{fontSize:11.5,fontWeight:500,color:'var(--accent)'}}>{'\ud83d\udcc1'} {folderFilter}</span>
            <button onClick={()=>setFolderFilter(null)} style={{color:'var(--accent)',padding:0,lineHeight:1}}><IX size={12}/></button>
          </div>
        )}
        <div style={{width:1,height:18,background:'rgba(0,0,0,.08)',margin:'0 4px'}}/>
        <button onClick={()=>setPlatFilter('all')} style={chipBtn(platFilter==='all')}>{'\u5168\u90e8'}</button>
        {PLATFORMS.map(p=>(
          <button key={p.id} onClick={()=>setPlatFilter(p.id)} style={chipBtn(platFilter===p.id)}>{p.name}</button>
        ))}
        <div style={{width:1,height:18,background:'rgba(0,0,0,.08)',margin:'0 4px'}}/>
        <button onClick={()=>setTagsExpanded(!tagsExpanded)} style={{padding:'4px 11px',borderRadius:20,fontSize:11.5,fontWeight:tagFilter!=='all'?600:500,cursor:'pointer',transition:'all .15s ease',
          background:tagFilter!=='all'?'var(--accent)':'var(--surface)',color:tagFilter!=='all'?'#fff':'var(--text-2)',
          border:tagFilter!=='all'?'1px solid var(--accent)':'1px solid rgba(0,0,0,.08)',display:'flex',alignItems:'center',gap:4}}>
          {'# 标签'}{tagFilter!=='all'&&<span style={{background:'rgba(255,255,255,.3)',borderRadius:10,padding:'0 5px',fontSize:10}}>{tagFilter}</span>}
          <span style={{display:'inline-flex',transform:tagsExpanded?'rotate(180deg)':'rotate(0)',transition:'transform .2s ease'}}><IDown size={12}/></span>
        </button>
        <div style={{width:1,height:18,background:'rgba(0,0,0,.08)',margin:'0 4px'}}/>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{padding:'4px 10px',border:'1px solid rgba(0,0,0,.08)',borderRadius:20,background:'var(--surface)',fontSize:11.5,color:'var(--text-2)',outline:'none',cursor:'pointer',fontWeight:500}}>
          <option value="date">{'\u6700\u65b0\u66f4\u65b0'}</option>
          <option value="rating">{'\u8bc4\u5206\u6700\u9ad8'}</option>
          <option value="uses">{'\u4f7f\u7528\u6700\u591a'}</option>
        </select>
        <div style={{flex:1}}/>
        <span style={{fontSize:11.5,color:'var(--text-3)',fontWeight:500}}>{filtered.length} {'\u6761\u7ed3\u679c'}</span>
        <button onClick={()=>{setBatchMode(!batchMode);setSelectedIds&&selectedIds.clear&&null}}
          style={{padding:'4px 12px',borderRadius:20,fontSize:11.5,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:4,
            background:batchMode?'var(--accent-bg)':'transparent',color:batchMode?'var(--accent)':'var(--text-2)',
            border:batchMode?'1px solid var(--accent-border)':'1px solid rgba(0,0,0,.08)',transition:'all .15s ease'}}>
          {batchMode?'\u9000\u51fa\u6279\u91cf':'\u6279\u91cf'}
        </button>
      </div>

      {/* Collapsible tag filter */}
      {tagsExpanded&&(
        <div className="anim-fade" style={{padding:'8px 20px',borderBottom:'0.5px solid rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',flexShrink:0}}>
          <button onClick={()=>setTagFilter('all')} style={chipBtn(tagFilter==='all')}>全部</button>
          {allTags.map(t=>(
            <button key={t} onClick={()=>setTagFilter(t===tagFilter?'all':t)} style={chipBtn(tagFilter===t)}>#{t}</button>
          ))}
        </div>
      )}

      {/* Batch action bar */}
      {batchMode&&(
        <div style={{padding:'8px 20px',background:'var(--accent-bg)',borderBottom:'0.5px solid var(--accent-border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={selectAll} style={{fontSize:12,fontWeight:500,color:'var(--accent)',padding:'4px 10px',borderRadius:20,background:'var(--surface)',border:'1px solid var(--accent-border)',cursor:'pointer'}}>
            {selectedIds.size===filtered.length&&filtered.length>0?'\u53d6\u6d88\u5168\u9009':'\u5168\u9009'}
          </button>
          <span style={{fontSize:12,color:'var(--text-2)'}}>{'\u5df2\u9009'} <strong style={{color:'var(--accent)'}}>{selectedIds.size}</strong> {'\u9879'}</span>
          <div style={{flex:1}}/>
          <div style={{position:'relative'}}>
            <button onClick={()=>setShowMoveMenu(!showMoveMenu)} disabled={selectedIds.size===0}
              style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:500,cursor:selectedIds.size===0?'not-allowed':'pointer',
                background:selectedIds.size===0?'rgba(0,0,0,.03)':'var(--surface)',color:selectedIds.size===0?'var(--text-3)':'var(--accent)',
                border:selectedIds.size===0?'1px solid rgba(0,0,0,.06)':'1px solid var(--accent-border)',display:'flex',alignItems:'center',gap:4}}>
              <IFolder size={13}/> {'\u79fb\u52a8\u5230'}
            </button>
            {showMoveMenu&&selectedIds.size>0&&(
              <div className="anim-fade" style={{position:'absolute',top:'100%',right:0,marginTop:4,background:'var(--surface)',borderRadius:10,border:'0.5px solid rgba(0,0,0,0.1)',boxShadow:'var(--shadow-lg)',minWidth:180,zIndex:50,padding:4}}>
                {allFolders&&allFolders.map(f=>(
                  <button key={f.name} onClick={()=>{onBatchMoveFolder(f.name);setShowMoveMenu(false)}}
                    style={{width:'100%',padding:'7px 10px',fontSize:12.5,textAlign:'left',borderRadius:6,display:'flex',alignItems:'center',gap:8,cursor:'pointer',transition:'all .1s ease'}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--accent-bg)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <span>{f.icon}</span><span style={{fontWeight:500}}>{f.name}</span>
                  </button>
                ))}
                <button onClick={()=>{onBatchMoveFolder('\u672a\u5206\u7c7b');setShowMoveMenu(false)}}
                  style={{width:'100%',padding:'7px 10px',fontSize:12.5,textAlign:'left',borderRadius:6,display:'flex',alignItems:'center',gap:8,cursor:'pointer',transition:'all .1s ease',borderTop:'0.5px solid rgba(0,0,0,0.06)',marginTop:2,paddingTop:9}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--accent-bg)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span>{'\ud83d\udcc2'}</span><span style={{fontWeight:500}}>{'\u672a\u5206\u7c7b'}</span>
                </button>
              </div>
            )}
          </div>
          <button onClick={onBatchDelete} disabled={selectedIds.size===0}
            style={{padding:'4px 14px',borderRadius:20,fontSize:12,fontWeight:500,cursor:selectedIds.size===0?'not-allowed':'pointer',
              background:selectedIds.size===0?'rgba(0,0,0,.03)':'var(--rose)',color:selectedIds.size===0?'var(--text-3)':'#fff',border:'none',display:'flex',alignItems:'center',gap:4}}>
            <ITrash size={13} color={selectedIds.size===0?'var(--text-3)':'#fff'}/> {'\u5220\u9664\u9009\u4e2d'}
          </button>
        </div>
      )}

      {/* Masonry grid */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',gap:0}}>
        <div style={{flex:1}}>
          {filtered.length===0?(
            <div style={{textAlign:'center',padding:'80px 20px',color:'var(--text-3)'}}>
              <IGrid size={36} color="var(--text-3)"/>
              <p style={{marginTop:12,fontSize:13}}>{'\u6ca1\u6709\u627e\u5230\u5339\u914d\u7684 Prompt'}</p>
            </div>
          ):(
            <div style={{columnCount:4,columnGap:12}}>
              {filtered.map((item,i)=>(
                <div key={item.id} style={{breakInside:'avoid',marginBottom:12,position:'relative'}}>
                  {batchMode&&(
                    <div onClick={(e)=>{e.stopPropagation();toggleBatchSelect(item.id)}}
                      style={{position:'absolute',top:10,left:10,zIndex:10,width:22,height:22,borderRadius:6,cursor:'pointer',
                        background:selectedIds.has(item.id)?'var(--accent)':'rgba(255,255,255,.9)',
                        border:selectedIds.has(item.id)?'none':'2px solid var(--border)',
                        display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',boxShadow:'var(--shadow-xs)'}}>
                      {selectedIds.has(item.id)&&<ICheck size={13} color="#fff" sw={2.5}/>}
                    </div>
                  )}
                  <PCard item={item} i={i} onClick={batchMode?()=>toggleBatchSelect(item.id):setViewingItem}/>
                </div>
              ))}
            </div>
          )}
        </div>
        {viewingItem&&!batchMode&&<DetailPanel item={viewingItem} onClose={()=>setViewingItem(null)} onUpdate={onUpdate} onDelete={onDelete} allFolders={allFolders}/>}
      </div>
    </div>
  );
};

/* ─── Prompt Editor Page ─── */

const Editor=({apiConfig,onOpenSettings})=>{
  const [selected,setSelected]=useState({subject:null,env:null,style:null,lens:null,params:null});
  const [customText,setCustomText]=useState({subject:'',env:'',style:'',lens:'',params:''});
  const [generated,setGenerated]=useState('');
  const [aiResult,setAiResult]=useState(null);
  const [optimizing,setOptimizing]=useState(false);
  const [optimizeError,setOptimizeError]=useState('');
  const [copiedOpt,setCopiedOpt]=useState(false);
  const [copiedNeg,setCopiedNeg]=useState(false);

  const categories=[
    {key:'subject',label:'主体',icon:<ITarget size={15}/>,color:'var(--accent)',items:BLOCKS.subject},
    {key:'env',label:'环境',icon:<ISun size={15}/>,color:'var(--violet)',items:BLOCKS.env},
    {key:'style',label:'风格',icon:<IPalette size={15}/>,color:'var(--rose)',items:BLOCKS.style},
    {key:'lens',label:'镜头',icon:<ICamera size={15}/>,color:'var(--sky)',items:BLOCKS.lens},
    {key:'params',label:'参数',icon:<ISliders size={15}/>,color:'var(--emerald)',items:BLOCKS.params},
  ];

  useEffect(()=>{
    const parts=[];
    categories.forEach(cat=>{
      const selId=selected[cat.key];
      if(!selId)return;
      if(selId===`custom_${cat.key}`){
        if(customText[cat.key]?.trim())parts.push(customText[cat.key].trim());
      } else {
        const block=cat.items.find(b=>b.id===selId);
        if(block)parts.push(block.text);
      }
    });
    setGenerated(parts.join(', '));
    setAiResult(null);
  },[selected,customText]);

  const handleOptimize=async()=>{
    if(!generated)return;
    const hasApi=apiConfig&&apiConfig.apiKey&&apiConfig.endpoint;
    if(!hasApi){setOptimizeError('请先点击右上角「AI 设置」配置 API Key');return}
    setOptimizing(true);setOptimizeError('');setAiResult(null);
    try{
      const result=await optimizePromptWithAI(generated,apiConfig);
      setAiResult(result);
    }catch(e){setOptimizeError(e.message||'AI 优化失败')}
    finally{setOptimizing(false)}
  };

  const copyText=(text,setter)=>{navigator.clipboard?.writeText(text);setter(true);setTimeout(()=>setter(false),2000)};

  return(
    <div className="anim-up" style={{height:'100%',overflowY:'auto',padding:28}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:700,letterSpacing:'-.4px'}}>Prompt 编辑器</h2>
        <p style={{color:'var(--text-3)',fontSize:13,marginTop:3,fontWeight:400}}>像搭积木一样组合 Prompt 模块，或自由输入自定义描述</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
        {/* Left: Block selectors */}
        <div>
          {categories.map((cat,ci)=>{
            const isCustom=selected[cat.key]===`custom_${cat.key}`;
            return(
            <div key={cat.key} className="anim-up" style={{animationDelay:`${ci*0.05}s`,marginBottom:18}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                <div style={{width:26,height:26,borderRadius:6,background:cat.color+'14',display:'flex',alignItems:'center',justifyContent:'center',color:cat.color}}>{cat.icon}</div>
                <span style={{fontSize:13.5,fontWeight:600,letterSpacing:'-.01em'}}>{cat.label}</span>
                {selected[cat.key]&&<span style={{fontSize:10,color:'var(--emerald)',fontWeight:500,marginLeft:2,display:'flex',alignItems:'center',gap:3}}><ICheck size={11}/> 已选择</span>}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {cat.items.map(block=>{
                  const isSelected=selected[cat.key]===block.id;
                  return(
                    <button key={block.id} onClick={()=>setSelected(prev=>({...prev,[cat.key]:isSelected?null:block.id}))}
                      style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,textAlign:'left',fontSize:13,transition:'all .15s ease',
                        background:isSelected?cat.color+'0A':'var(--surface)',
                        border:isSelected?`1.5px solid ${cat.color}40`:'1px solid rgba(0,0,0,0.06)',
                        fontWeight:isSelected?500:400,color:isSelected?cat.color:'var(--text)',letterSpacing:'-.01em'}}
                      onMouseEnter={e=>{if(!isSelected)e.currentTarget.style.borderColor='rgba(0,0,0,.12)'}}
                      onMouseLeave={e=>{if(!isSelected)e.currentTarget.style.borderColor='rgba(0,0,0,0.06)'}}>
                      <span style={{fontSize:16}}>{block.emoji}</span>
                      <span style={{flex:1}}>{block.text}</span>
                      {isSelected&&<div style={{width:18,height:18,borderRadius:'50%',background:cat.color,display:'flex',alignItems:'center',justifyContent:'center'}}><ICheck size={11} color="#fff" sw={2.5}/></div>}
                    </button>
                  );
                })}
                {/* Custom input option */}
                <button onClick={()=>setSelected(prev=>({...prev,[cat.key]:isCustom?null:`custom_${cat.key}`}))}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,textAlign:'left',fontSize:13,transition:'all .15s ease',
                    background:isCustom?cat.color+'0A':'var(--surface)',
                    border:isCustom?`1.5px solid ${cat.color}40`:'1px dashed rgba(0,0,0,0.12)',
                    fontWeight:isCustom?500:400,color:isCustom?cat.color:'var(--text-3)',letterSpacing:'-.01em'}}
                  onMouseEnter={e=>{if(!isCustom)e.currentTarget.style.borderColor='var(--accent-border)'}}
                  onMouseLeave={e=>{if(!isCustom)e.currentTarget.style.borderColor='rgba(0,0,0,0.12)'}}>
                  <span style={{fontSize:16}}>✏️</span>
                  <span style={{flex:1}}>自定义输入...</span>
                  {isCustom&&<div style={{width:18,height:18,borderRadius:'50%',background:cat.color,display:'flex',alignItems:'center',justifyContent:'center'}}><ICheck size={11} color="#fff" sw={2.5}/></div>}
                </button>
                {isCustom&&(
                  <input value={customText[cat.key]||''}
                    onChange={e=>setCustomText(prev=>({...prev,[cat.key]:e.target.value}))}
                    placeholder={`输入自定义${cat.label}描述...`}
                    autoFocus
                    style={{padding:'8px 12px',borderRadius:8,border:`1.5px solid ${cat.color}50`,background:cat.color+'04',fontSize:13,
                      color:'var(--text)',outline:'none',fontFamily:'inherit',marginTop:2,letterSpacing:'-.01em'}}
                    onFocus={e=>e.target.style.boxShadow=`0 0 0 3px ${cat.color}12`}
                    onBlur={e=>e.target.style.boxShadow='none'}/>
                )}
              </div>
              {ci<categories.length-1&&(
                <div style={{display:'flex',justifyContent:'center',margin:'12px 0'}}>
                  <div style={{width:2,height:20,background:'var(--border-light)',borderRadius:1}}/>
                </div>
              )}
            </div>
            );
          })}
        </div>

        {/* Right: Preview */}
        <div>
          <div className="card" style={{padding:20,position:'sticky',top:0,borderRadius:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              <ISparkle size={16} color="var(--accent)"/>
              <span style={{fontSize:15,fontWeight:600,letterSpacing:'-.02em'}}>组合预览</span>
            </div>

            {/* Module chain */}
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:18}}>
              {categories.map((cat,i)=>{
                const selId=selected[cat.key];
                const isCustom=selId===`custom_${cat.key}`;
                const block=selId&&!isCustom?cat.items.find(b=>b.id===selId):null;
                const hasContent=block||(isCustom&&customText[cat.key]?.trim());
                return(
                  <div key={cat.key} style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:22,height:22,borderRadius:'50%',background:hasContent?cat.color+'18':'var(--surface-alt)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,flexShrink:0,color:hasContent?cat.color:'var(--text-3)',fontWeight:600}}>{i+1}</div>
                    <div style={{padding:'6px 12px',borderRadius:6,flex:1,fontSize:12.5,
                      background:hasContent?cat.color+'06':'var(--bg)',border:`1px solid ${hasContent?cat.color+'20':'rgba(0,0,0,0.04)'}`,
                      color:hasContent?'var(--text)':'var(--text-3)',fontWeight:hasContent?500:400,letterSpacing:'-.01em'}}>
                      {isCustom&&customText[cat.key]?.trim()?`✏️ ${customText[cat.key].trim()}`:block?`${block.emoji} ${block.text}`:`选择${cat.label}模块...`}
                    </div>
                    {i<categories.length-1&&<span style={{color:'var(--text-3)',fontSize:13,flexShrink:0,opacity:.5}}>+</span>}
                  </div>
                );
              })}
            </div>

            {/* Generated Prompt (raw combination) */}
            <div style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:'.1px'}}>基础组合</div>
                <button onClick={()=>generated&&copyText(generated,setCopiedOpt)} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:copiedOpt?'var(--emerald)':'var(--accent)',fontWeight:500}}>
                  {copiedOpt?<ICheck size={12}/>:<ICopy size={12}/>} {copiedOpt?'已复制':'复制'}
                </button>
              </div>
              <div style={{padding:12,background:'var(--bg)',borderRadius:8,fontSize:12.5,lineHeight:1.7,minHeight:50,
                color:generated?'var(--text-2)':'var(--text-3)',border:'1px solid rgba(0,0,0,0.04)'}}>
                {generated||'在左侧选择模块或输入自定义描述...'}
              </div>
            </div>

            {/* AI Optimize Button */}
            <div style={{marginBottom:14}}>
              <button onClick={handleOptimize} disabled={!generated||optimizing}
                style={{width:'100%',padding:'10px 18px',borderRadius:8,fontSize:13,fontWeight:600,cursor:!generated||optimizing?'not-allowed':'pointer',transition:'all .2s ease',
                  background:!generated?'rgba(0,0,0,.04)':optimizing?'linear-gradient(135deg,#007AFF,#5856D6)':'linear-gradient(135deg,#007AFF,#5856D6)',
                  color:!generated?'var(--text-3)':'#fff',border:'none',display:'flex',alignItems:'center',justifyContent:'center',gap:7,
                  boxShadow:!generated?'none':'0 2px 8px rgba(0,122,255,.25)',
                  transform:optimizing?'scale(.98)':'none',letterSpacing:'-.01em'}}
                onMouseEnter={e=>{if(generated&&!optimizing)e.currentTarget.style.boxShadow='0 4px 12px rgba(0,122,255,.3)'}}
                onMouseLeave={e=>{if(!optimizing)e.currentTarget.style.boxShadow=generated?'0 2px 8px rgba(0,122,255,.25)':'none'}}>
                {optimizing?(
                  <><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{animation:'spin 1s linear infinite'}}>
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                  </svg> AI 正在优化...</>
                ):(
                  <><ISparkle size={15} color="#fff" sw={2}/> AI 智能优化 Prompt</>
                )}
              </button>
              {!apiConfig?.apiKey&&(
                <button onClick={onOpenSettings} style={{width:'100%',marginTop:4,fontSize:11,color:'var(--accent)',fontWeight:500,padding:'3px 0',background:'none',border:'none',cursor:'pointer'}}>
                  ⚙️ 需要先配置 AI API Key
                </button>
              )}
              {optimizeError&&(
                <div style={{marginTop:6,padding:'7px 10px',background:'rgba(255,59,48,.06)',borderRadius:6,fontSize:12,color:'var(--rose)',border:'1px solid rgba(255,59,48,.12)',display:'flex',alignItems:'center',gap:5}}>
                  <span>⚠️</span>{optimizeError}
                </div>
              )}
            </div>

            {/* AI Optimized Result */}
            {aiResult&&(
              <div className="anim-up" style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--accent)',display:'flex',alignItems:'center',gap:4,letterSpacing:'.1px'}}>
                    <ISparkle size={12}/> AI 优化结果
                  </div>
                  <button onClick={()=>copyText(aiResult.optimized,setCopiedOpt)} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:copiedOpt?'var(--emerald)':'var(--accent)',fontWeight:500}}>
                    {copiedOpt?<ICheck size={12}/>:<ICopy size={12}/>} {copiedOpt?'已复制':'复制'}
                  </button>
                </div>
                <div style={{padding:14,background:'var(--accent-bg)',borderRadius:10,fontSize:13,lineHeight:1.7,
                  color:'var(--text)',border:'1px solid var(--accent-border)'}}>
                  {aiResult.optimized}
                </div>

                {aiResult.negative&&(
                  <div style={{marginTop:10}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                      <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:'.1px'}}>负向提示词</div>
                      <button onClick={()=>copyText(aiResult.negative,setCopiedNeg)} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:copiedNeg?'var(--emerald)':'var(--accent)',fontWeight:500}}>
                        {copiedNeg?<ICheck size={12}/>:<ICopy size={12}/>} {copiedNeg?'已复制':'复制'}
                      </button>
                    </div>
                    <div style={{padding:10,background:'rgba(255,59,48,.04)',borderRadius:8,fontSize:12,lineHeight:1.6,color:'var(--rose)',border:'1px solid rgba(255,59,48,.08)'}}>
                      {aiResult.negative}
                    </div>
                  </div>
                )}

                {aiResult.tips&&(
                  <div style={{marginTop:8,padding:'8px 12px',background:'rgba(255,149,0,.06)',borderRadius:8,border:'1px solid rgba(255,149,0,.15)'}}>
                    <div style={{fontSize:11.5,color:'#B25000',lineHeight:1.5}}>
                      💡 {aiResult.tips}
                    </div>
                  </div>
                )}
              </div>
            )}

            <div style={{display:'flex',gap:8}}>
              <button className="btn-primary" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}
                onClick={()=>{const text=aiResult?.optimized||generated;if(text)navigator.clipboard?.writeText(text)}}>
                <ICopy size={14} color="#fff"/> 复制{aiResult?'优化后':'基础'} Prompt
              </button>
              <button className="btn-ghost" style={{display:'flex',alignItems:'center',gap:5}}
                onClick={()=>{setSelected({subject:null,env:null,style:null,lens:null,params:null});setCustomText({subject:'',env:'',style:'',lens:'',params:''});setAiResult(null)}}>
                <IRefresh size={14}/> 重置
              </button>
            </div>

            {/* Quick tips */}
            <div style={{marginTop:16,padding:12,background:'rgba(255,149,0,.04)',borderRadius:8,border:'1px solid rgba(255,149,0,.1)'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#B25000',marginBottom:3}}>💡 使用技巧</div>
              <div style={{fontSize:11.5,color:'#8C4400',lineHeight:1.6}}>
                模块顺序会影响生成效果。一般建议：主体 → 环境 → 风格 → 镜头 → 参数。
                越重要的描述放在越前面。也可以点击"自定义输入"自由填写描述内容。
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ─── Recycle Bin Page ─── */
const RecycleBin=({items,onRestore,onPermanentDelete,onEmptyTrash})=>{
  const [confirmEmpty,setConfirmEmpty]=useState(false);
  const daysLeft=(deletedAt)=>{const d=7-Math.floor((Date.now()-deletedAt)/(24*60*60*1000));return Math.max(0,d)};

  if(items.length===0)return(
    <div className="anim-up" style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:40}}>
      <div style={{width:64,height:64,borderRadius:16,background:'var(--surface-alt)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
        <ITrash size={28} color="var(--text-3)"/>
      </div>
      <h2 style={{fontSize:17,fontWeight:600,marginBottom:4,color:'var(--text-2)',letterSpacing:'-.02em'}}>回收站是空的</h2>
      <p style={{fontSize:13,color:'var(--text-3)',textAlign:'center',maxWidth:280}}>删除的 Prompt 资产会在这里保留 7 天，之后自动彻底清除。</p>
    </div>
  );

  return(
    <div className="anim-up" style={{height:'100%',overflowY:'auto',padding:28}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:700,letterSpacing:'-.4px'}}>回收站</h2>
          <p style={{color:'var(--text-3)',fontSize:13,marginTop:3}}>已删除的项目将在 7 天后自动彻底清除</p>
        </div>
        {confirmEmpty?(
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:12,color:'var(--rose)',fontWeight:600}}>确认清空？</span>
            <button onClick={()=>{onEmptyTrash();setConfirmEmpty(false)}} style={{padding:'6px 14px',borderRadius:8,background:'#EF4444',color:'#fff',border:'none',fontSize:12,fontWeight:600,cursor:'pointer'}}>确认</button>
            <button onClick={()=>setConfirmEmpty(false)} className="btn-ghost" style={{padding:'6px 14px',fontSize:12}}>取消</button>
          </div>
        ):(
          <button onClick={()=>setConfirmEmpty(true)} style={{padding:'6px 14px',borderRadius:6,fontSize:12,fontWeight:500,color:'var(--rose)',background:'rgba(255,59,48,.06)',border:'1px solid rgba(255,59,48,.15)',cursor:'pointer'}}>
            清空回收站
          </button>
        )}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {items.map((item,i)=>{
          const plat=PLATFORMS.find(p=>p.id===item.platform);
          const days=daysLeft(item.deletedAt);
          return(
            <div key={item.id} className="card anim-up" style={{animationDelay:`${i*0.03}s`,display:'flex',alignItems:'center',gap:14,padding:14,borderRadius:12}}>
              <img src={item.thumbnail||phImg(item.seed,80,80)} alt="" style={{width:56,height:56,borderRadius:8,objectFit:'cover',flexShrink:0,opacity:.7}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',letterSpacing:'-.01em'}}>{item.title}</div>
                <div style={{display:'flex',gap:8,alignItems:'center',marginTop:3}}>
                  <span className="tag" style={{background:plat?.bg,color:plat?.color,fontSize:10}}>{plat?.name}</span>
                  <span style={{fontSize:11,color:days<=2?'var(--rose)':'var(--text-3)',fontWeight:days<=2?500:400}}>
                    {days>0?`${days} 天后彻底删除`:'即将清除'}
                  </span>
                </div>
              </div>
              <div style={{display:'flex',gap:6,flexShrink:0}}>
                <button onClick={()=>onRestore(item.id)} style={{padding:'5px 12px',borderRadius:6,fontSize:12,fontWeight:500,cursor:'pointer',background:'var(--accent-bg)',color:'var(--accent)',border:'1px solid var(--accent-border)',display:'flex',alignItems:'center',gap:4}}>
                  <IRefresh size={12}/> 恢复
                </button>
                <button onClick={()=>onPermanentDelete(item.id)} style={{padding:'5px 8px',borderRadius:6,fontSize:12,cursor:'pointer',background:'transparent',color:'var(--rose)',border:'1px solid rgba(255,59,48,.15)'}} title="彻底删除">
                  <ITrash size={12}/>
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ─── Folder Dialog (Create / Edit) ─── */
const FOLDER_ICONS=['💡','📷','🎨','✏️','👤','📸','🏛️','🏮','🎮','🎬','🎵','📐','🌿','🔥','⭐','🌈','🎯','💎','🦋','🍀','🌸','🏔️','🚀','🎭'];
const FolderDialog=({mode,editFolder,existingNames,onSave,onClose})=>{
  const [name,setEditName]=useState(editFolder?editFolder.name:'');
  const [icon,setEditIcon]=useState(editFolder?editFolder.icon:'📁');
  const [error,setError]=useState('');
  const handleSubmit=()=>{
    const trimmed=name.trim();
    if(!trimmed){setError('请输入收藏夹名称');return}
    if(mode==='create'&&existingNames.includes(trimmed)){setError('该名称已存在');return}
    if(mode==='edit'&&trimmed!==editFolder.name&&existingNames.includes(trimmed)){setError('该名称已存在');return}
    onSave({name:trimmed,icon});
  };
  return(
    <div className="anim-fade" style={{position:'fixed',inset:0,background:'rgba(0,0,0,.3)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}} onClick={onClose}>
      <div className="anim-scale" onClick={e=>e.stopPropagation()} style={{width:400,background:'var(--surface)',borderRadius:14,boxShadow:'var(--shadow-lg)',overflow:'hidden'}}>
        <div style={{padding:'18px 22px 12px',display:'flex',alignItems:'center',borderBottom:'0.5px solid rgba(0,0,0,0.06)'}}>
          <div><h3 style={{fontSize:16,fontWeight:600,letterSpacing:'-.02em'}}>{mode==='create'?'新建收藏夹':'编辑收藏夹'}</h3></div>
          <div style={{flex:1}}/>
          <button onClick={onClose} style={{color:'var(--text-3)',padding:4,borderRadius:6,display:'flex',transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(0,0,0,.04)'}} onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}><IX size={17}/></button>
        </div>
        <div style={{padding:'18px 22px'}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:6,letterSpacing:'.1px'}}>图标</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:16}}>
            {FOLDER_ICONS.map(ic=>(
              <button key={ic} onClick={()=>setEditIcon(ic)}
                style={{width:34,height:34,borderRadius:6,fontSize:17,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all .15s ease',
                  background:icon===ic?'var(--accent-bg)':'var(--bg)',
                  border:icon===ic?'1.5px solid var(--accent)':'1px solid rgba(0,0,0,0.06)'}}>
                {ic}
              </button>
            ))}
          </div>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:6,letterSpacing:'.1px'}}>名称</label>
          <input value={name} onChange={e=>{setEditName(e.target.value);setError('')}} autoFocus
            placeholder="输入收藏夹名称..."
            style={{width:'100%',padding:'8px 12px',border:error?'1px solid var(--rose)':'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:13,color:'var(--text)',fontFamily:'inherit',transition:'border-color .2s ease'}}
            onFocus={e=>{if(!error)e.target.style.borderColor='var(--accent)'}}
            onBlur={e=>{if(!error)e.target.style.borderColor='rgba(0,0,0,.1)'}}
            onKeyDown={e=>{if(e.key==='Enter')handleSubmit()}}/>
          {error&&<p style={{fontSize:11,color:'var(--rose)',marginTop:4}}>{error}</p>}
        </div>
        <div style={{padding:'12px 22px',borderTop:'0.5px solid rgba(0,0,0,0.06)',display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn-ghost">取消</button>
          <button onClick={handleSubmit} className="btn-primary" style={{minWidth:80,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
            {mode==='create'?<><IPlus size={14}/> 创建</>:<><ICheck size={14}/> 保存</>}
          </button>
        </div>
      </div>
    </div>
  );
};

/* ─── Main App ─── */
const App=()=>{
  const [page,setPage]=useState('dashboard');
  const [items,setItems]=useState(()=>{
    const initialized=localStorage.getItem('promptos_initialized');
    if(!initialized){
      localStorage.setItem('promptos_initialized','1');
      return MOCK_ITEMS;
    }
    return getUserItems();
  });
  const [trash,setTrash]=useState(()=>{try{const s=localStorage.getItem('promptos_trash');return s?JSON.parse(s):[];}catch{return[]}});
  const [q,setQ]=useState('');
  const [showUpload,setShowUpload]=useState(false);
  const [viewingItem,setViewingItem]=useState(null);
  const [apiConfig,setApiConfig]=useState(()=>getApiConfig());
  const [showSettings,setShowSettings]=useState(false);
  const [folderFilter,setFolderFilter]=useState(null);
  const [batchMode,setBatchMode]=useState(false);
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [customFolders,setCustomFolders]=useState(()=>{try{const s=localStorage.getItem('promptos_custom_folders');return s?JSON.parse(s):[];}catch{return[]}});
  const [folderDialog,setFolderDialog]=useState(null); // null | {mode:'create'} | {mode:'edit',folder:{name,icon}}

  // persist user items to localStorage whenever they change
  useEffect(()=>{
    const userItems=items.filter(i=>i.user);
    saveUserItems(userItems);
  },[items]);

  // persist trash to localStorage
  useEffect(()=>{
    try{localStorage.setItem('promptos_trash',JSON.stringify(trash))}catch(e){}
  },[trash]);

  // persist custom folders
  useEffect(()=>{
    try{localStorage.setItem('promptos_custom_folders',JSON.stringify(customFolders))}catch(e){}
  },[customFolders]);

  // auto-clean trash items older than 7 days
  useEffect(()=>{
    const now=Date.now();
    const cleaned=trash.filter(i=>now-i.deletedAt<7*24*60*60*1000);
    if(cleaned.length!==trash.length)setTrash(cleaned);
  },[]);

  const filtered=useMemo(()=>{
    let r=[...items];
    if(folderFilter)r=r.filter(i=>i.folder===folderFilter);
    if(q.trim()){
      const lq=q.toLowerCase();
      r=r.filter(i=>
        i.title.toLowerCase().includes(lq)||
        i.prompt.toLowerCase().includes(lq)||
        i.tags.some(t=>t.toLowerCase().includes(lq))||
        i.note.toLowerCase().includes(lq)
      );
    }
    return r;
  },[items,q,folderFilter]);

  const handleSave=(newItem)=>{
    setItems(prev=>[newItem,...prev]);
  };

  const handleUpdate=(updatedItem)=>{
    setItems(prev=>prev.map(i=>i.id===updatedItem.id?updatedItem:i));
    setViewingItem(updatedItem);
  };

  const handleDelete=(id)=>{
    const item=items.find(i=>i.id===id);
    if(item){
      setTrash(prev=>[...prev,{...item,deletedAt:Date.now()}]);
      setItems(prev=>prev.filter(i=>i.id!==id));
      if(viewingItem&&viewingItem.id===id)setViewingItem(null);
    }
  };

  const handleBatchDelete=(ids)=>{
    const toDelete=items.filter(i=>ids.has(i.id));
    const now=Date.now();
    setTrash(prev=>[...prev,...toDelete.map(i=>({...i,deletedAt:now}))]);
    setItems(prev=>prev.filter(i=>!ids.has(i.id)));
    setSelectedIds(new Set());
    setBatchMode(false);
  };

  const handleUpdateFolder=(itemId,newFolder)=>{
    setItems(prev=>prev.map(i=>i.id===itemId?{...i,folder:newFolder}:i));
    if(viewingItem&&viewingItem.id===itemId)setViewingItem({...viewingItem,folder:newFolder});
  };

  const handleBatchMoveFolder=(folderName)=>{
    setItems(prev=>prev.map(i=>selectedIds.has(i.id)?{...i,folder:folderName}:i));
    setSelectedIds(new Set());
    setBatchMode(false);
  };

  const handleRestore=(id)=>{
    const item=trash.find(i=>i.id===id);
    if(item){
      const {deletedAt,...rest}=item;
      setItems(prev=>[rest,...prev]);
      setTrash(prev=>prev.filter(i=>i.id!==id));
    }
  };

  const handlePermanentDelete=(id)=>{
    setTrash(prev=>prev.filter(i=>i.id!==id));
  };

  const handleEmptyTrash=()=>{
    setTrash([]);
  };

  const handleCreateFolder=(folder)=>{
    const allNames=[...FOLDERS,...customFolders].map(f=>f.name);
    if(allNames.includes(folder.name))return;
    setCustomFolders(prev=>[...prev,folder]);
  };

  const handleRenameFolder=(oldName,newData)=>{
    const allNames=[...FOLDERS,...customFolders].map(f=>f.name);
    if(newData.name!==oldName&&allNames.includes(newData.name))return;
    const isDefault=FOLDERS.some(f=>f.name===oldName);
    if(isDefault){
      if(newData.name!==oldName){
        setItems(prev=>prev.map(i=>i.folder===oldName?{...i,folder:newData.name}:i));
        setTrash(prev=>prev.map(i=>i.folder===oldName?{...i,folder:newData.name}:i));
      }
      setCustomFolders(prev=>{
        const existing=prev.find(f=>f._overrides===oldName);
        if(existing)return prev.map(f=>f._overrides===oldName?{...f,name:newData.name,icon:newData.icon}:f);
        return [...prev,{name:newData.name,icon:newData.icon,_overrides:oldName}];
      });
    } else {
      if(newData.name!==oldName){
        setItems(prev=>prev.map(i=>i.folder===oldName?{...i,folder:newData.name}:i));
        setTrash(prev=>prev.map(i=>i.folder===oldName?{...i,folder:newData.name}:i));
      }
      setCustomFolders(prev=>prev.map(f=>f.name===oldName?{...f,name:newData.name,icon:newData.icon}:f));
    }
    if(folderFilter===oldName)setFolderFilter(newData.name);
  };

  const handleDeleteFolder=(name)=>{
    const isDefault=FOLDERS.some(f=>f.name===name);
    if(isDefault){
      setCustomFolders(prev=>[...prev.filter(f=>f._overrides!==name),{name,icon:'🗑️',_hidden:true,_overrides:name}]);
    } else {
      setCustomFolders(prev=>prev.filter(f=>f.name!==name));
    }
    setItems(prev=>prev.map(i=>i.folder===name?{...i,folder:'未分类'}:i));
    if(folderFilter===name)setFolderFilter(null);
  };

  const handleApiConfigChange=(cfg)=>{
    setApiConfig(cfg);
    saveApiConfig(cfg);
  };

  const handleFolderClick=(folder)=>{
    setFolderFilter(folder);
  };

  const dynamicFolders=useMemo(()=>{
    const hiddenCustoms=customFolders.filter(f=>f._hidden).map(f=>f._overrides||f.name);
    const overrides={};
    customFolders.filter(f=>f._overrides&&!f._hidden).forEach(f=>{overrides[f._overrides]={name:f.name,icon:f.icon}});
    const defaults=FOLDERS.filter(f=>!hiddenCustoms.includes(f.name)).map(f=>{
      const ov=overrides[f.name];
      const name=ov?ov.name:f.name;const icon=ov?ov.icon:f.icon;
      return {name,icon,count:items.filter(i=>i.folder===name).length};
    });
    const customs=customFolders.filter(f=>!f._hidden&&!f._overrides).map(f=>({...f,count:items.filter(i=>i.folder===f.name).length}));
    return [...defaults,...customs];
  },[items,customFolders]);

  const toggleBatchSelect=(id)=>{
    setSelectedIds(prev=>{const n=new Set(prev);if(n.has(id))n.delete(id);else n.add(id);return n});
  };

  const selectAll=()=>{
    if(selectedIds.size===filtered.length)setSelectedIds(new Set());
    else setSelectedIds(new Set(filtered.map(i=>i.id)));
  };

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar page={page} setPage={setPage} folders={dynamicFolders} folderFilter={folderFilter} onFolderClick={handleFolderClick} trashCount={trash.length} itemCount={items.length}
        onCreateFolder={()=>setFolderDialog({mode:'create'})} onEditFolder={(f)=>setFolderDialog({mode:'edit',folder:f})} onDeleteFolder={handleDeleteFolder}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <TopBar q={q} setQ={setQ} onUpload={()=>setShowUpload(true)} page={page} setPage={setPage} onOpenSettings={()=>setShowSettings(true)} items={items} setViewingItem={setViewingItem}/>
        <div style={{flex:1,overflow:'hidden'}}>
          {page==='dashboard'&&<Dashboard items={filtered} folders={dynamicFolders} setPage={setPage} setViewingItem={setViewingItem} setFolderFilter={setFolderFilter} onUpload={()=>setShowUpload(true)}/>}
          {page==='library'&&<Library items={filtered} viewingItem={viewingItem} setViewingItem={setViewingItem} onUpdate={handleUpdate} onDelete={handleDelete} folderFilter={folderFilter} setFolderFilter={setFolderFilter} batchMode={batchMode} setBatchMode={setBatchMode} selectedIds={selectedIds} toggleBatchSelect={toggleBatchSelect} selectAll={selectAll} onBatchDelete={()=>handleBatchDelete(selectedIds)} allFolders={dynamicFolders} onBatchMoveFolder={handleBatchMoveFolder}/>}
          {page==='editor'&&<Editor apiConfig={apiConfig} onOpenSettings={()=>setShowSettings(true)}/>}
          {page==='recycle'&&<RecycleBin items={trash} onRestore={handleRestore} onPermanentDelete={handlePermanentDelete} onEmptyTrash={handleEmptyTrash}/>}
        </div>
      </div>
      {showUpload&&<AnalysisOverlay onClose={()=>setShowUpload(false)} onSave={handleSave} apiConfig={apiConfig} onOpenSettings={()=>setShowSettings(true)}/>}
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} apiConfig={apiConfig} setApiConfig={handleApiConfigChange}/>}
      {folderDialog&&<FolderDialog mode={folderDialog.mode} editFolder={folderDialog.folder} existingNames={dynamicFolders.map(f=>f.name)}
        onSave={(data)=>{if(folderDialog.mode==='create')handleCreateFolder(data);else handleRenameFolder(folderDialog.folder.name,data);setFolderDialog(null)}}
        onClose={()=>setFolderDialog(null)}/>}
    </div>
  );
};

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
