*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#F5F5F7;--surface:#FFFFFF;--surface-alt:#F0F0F2;
--border:rgba(0,0,0,0.08);--border-light:rgba(0,0,0,0.04);
--text:#1D1D1F;--text-2:#86868B;--text-3:#AEAEB2;
--accent:#007AFF;--accent-2:#5AC8FA;--accent-bg:rgba(0,122,255,0.06);--accent-border:rgba(0,122,255,0.2);
--violet:#AF52DE;--rose:#FF3B30;--emerald:#34C759;--amber:#FF9500;--sky:#5AC8FA;
--radius:10px;--radius-lg:14px;--radius-xl:20px;
--shadow-xs:0 0.5px 1px rgba(0,0,0,0.03);
--shadow-sm:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.02);
--shadow-md:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
--shadow-lg:0 12px 40px rgba(0,0,0,0.1),0 4px 12px rgba(0,0,0,0.04);
--sidebar:240px;--topbar:52px;
--font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC",system-ui,sans-serif;
}
html,body,#root{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em}
input,textarea,button,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:10px;border:1px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.15);background-clip:padding-box}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleUp{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.7}}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes progress{from{width:0}to{width:100%}}
@keyframes tagPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.12)}50%{box-shadow:0 0 0 8px rgba(0,122,255,0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.anim-up{animation:fadeUp .3s cubic-bezier(.25,.1,.25,1) both}
.anim-fade{animation:fadeIn .2s ease both}
.anim-slide{animation:slideRight .3s cubic-bezier(.25,.1,.25,1) both}
.anim-scale{animation:scaleUp .18s cubic-bezier(.25,.1,.25,1) both}
.anim-tag{animation:tagPop .2s cubic-bezier(.25,.1,.25,1) both}

.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8)}
.btn-primary{background:var(--accent);color:#fff;border-radius:8px;padding:7px 16px;font-weight:600;font-size:13px;transition:all .2s cubic-bezier(.25,.1,.25,1);letter-spacing:-0.01em}
.btn-primary:hover{background:#0066D6;box-shadow:0 2px 8px rgba(0,122,255,.25)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{border-radius:8px;padding:7px 14px;font-weight:500;font-size:13px;color:var(--text-2);transition:all .2s cubic-bezier(.25,.1,.25,1);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.14);color:var(--text)}
.btn-ghost:active{background:rgba(0,0,0,.04)}
.card{background:var(--surface);border-radius:var(--radius-lg);border:0.5px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-sm);transition:all .25s cubic-bezier(.25,.1,.25,1)}
.card:hover{box-shadow:var(--shadow-md);border-color:rgba(0,0,0,0.12)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:0}
.nav-active{background:rgba(0,0,0,.05);position:relative}
.nav-active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--accent)}
</style>

</head>

const decomposePrompt = async (promptText, base64Image, apiConfig, signal) => {
  const {endpoint, model, apiKey} = apiConfig;
  if (!endpoint || !model || !apiKey) throw new Error('请先在设置中配置 API 地址和 Key');

  const systemPrompt = `你是一个专业的 AI 图片生成 Prompt 分析师。请将用户提供的 Prompt 文本拆解为结构化的模块。

严格按照以下 JSON 格式返回，不要包含任何其他文字：
{
  "analysis": {
    "subject": "画面主体描述",
    "character": "人物描述（无人物填"—"）",
    "env": "环境场景",
    "style": "视觉艺术风格",
    "color": "色彩特征和色调",
    "comp": "构图方式",
    "angle": "观察视角（鸟瞰俯视/高角度俯视/轻微俯视/平视/轻微仰视/低角度仰视/极端仰视，所有类型图片都必须填写）",
    "lens": "镜头类型（广角/标准/长焦/微距等，无法判断填"—"）",
    "light": "光影效果",
    "models": ["推荐AI平台1"],
    "suggestedParams": ["建议画幅", "建议画质", "建议风格"]
  },
  "tags": ["标签1", "标签2", "标签3"]
}

拆解要求：
1. 从 Prompt 文本中精准提取各模块信息，不要编造
2. 如果某个模块在文本中无法推断，填"—"
3. tags 提取 3-5 个精准中文分类标签
4. models 从"即梦 Dreamina"、"ChatGPT"、"通义万相"中选最合适的 1-2 个`;

  const userContent = [];
  if (base64Image) {
    userContent.push({type: 'image_url', image_url: {url: base64Image}});
    userContent.push({type: 'text', text: `请结合这张图片和以下 Prompt 文本进行拆解分析。如果 Prompt 中缺少某些信息但图片中可以看到，请根据图片补充：

${promptText}`});
  } else {
    userContent.push({type: 'text', text: `请拆解以下 Prompt 文本：

${promptText}`});
  }

  const body = {
    model,
    messages: [
      {role: 'system', content: systemPrompt},
      {role: 'user', content: userContent}
    ],
    temperature: 0.3,
    max_tokens: 1500,
  };

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`},
    body: JSON.stringify(body),
    signal,
  });

  if (!res.ok) {
    if (res.status === 401) throw new Error('API Key 无效');
    if (res.status === 400) throw new Error('请求参数错误，请检查模型是否支持');
    throw new Error(`API 请求失败 (${res.status})`);
  }

  const data = await res.json();
  const c = data.choices?.[0]?.message?.content;
  if (!c) throw new Error('AI 返回了空结果');

  let parsed;
  try { parsed = JSON.parse(c); }
  catch {
    const m = c.match(/\{[\s\S]*\}/);
    if (m) { try { parsed = JSON.parse(m[0]); } catch { throw new Error('AI 返回格式异常'); } }
    else throw new Error('无法解析 AI 返回结果');
  }
  if (!parsed.analysis) throw new Error('AI 分析结果不完整');
  return parsed;
};

const migrateItem = (item) => {

  if (!item.versions || !Array.isArray(item.versions)) {

      v: 1,

      note: '\u521d\u59cb\u7248\u672c'
    }];
  }
  // Ensure derivedFrom field (reuse chain)
  if (item.derivedFrom === undefined) {
    item.derivedFrom = null;

  // Ensure analysis/disassembly exists
  if (!item.analysis) {
    item.analysis = {subject:'\u2014',character:'\u2014',env:'\u2014',style:'\u2014',color:'\u2014',comp:'\u2014',angle:'\u2014',lens:'\u2014',light:'\u2014',models:[],suggestedParams:[]};

    item.analysis.angle = '\u2014';
  }
  // Ensure schema version tag
  item._schema = SCHEMA_VERSION;

};

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

/* ─── Uploading / AI Analysis Overlay ─── */

const AnalysisOverlay=({onClose,onSave,apiConfig,onOpenSettings})=>{
  const [phase,setPhase]=useState(0); // 0=upload, 1=analyzing, 2=result, -1=error
  const [selectedImg,setSelectedImg]=useState(null);
  const [progress,setProgress]=useState(0);
  const [progressText,setProgressText]=useState('准备分析...');
  const [tagsShown,setTagsShown]=useState([]);
  const [promptRevealed,setPromptRevealed]=useState(false);
  const [aiResult,setAiResult]=useState(null);
  const [errorMsg,setErrorMsg]=useState('');
  const [copied,setCopied]=useState(false);
  const [selectedPlatform,setSelectedPlatform]=useState('jimeng');
  const [manualMode,setManualMode]=useState(false);
  const [manualTitle,setManualTitle]=useState('');
  const [manualPrompt,setManualPrompt]=useState('');
  const [manualNeg,setManualNeg]=useState('');
  const [manualTags,setManualTags]=useState('');
  const [manualImg,setManualImg]=useState(null);
  const [manualRatio,setManualRatio]=useState('16:9');
  const [manualQuality,setManualQuality]=useState('高清');
  const [manualStyle,setManualStyle]=useState('写实');
  const [decomposeResult,setDecomposeResult]=useState(null);
  const [decomposing,setDecomposing]=useState(false);
  const [decomposeError,setDecomposeError]=useState('');
  const decomposeAbortRef=useRef(null);
  const manualFileRef=useRef(null);
  const fileRef=useRef(null);
  const abortRef=useRef(null);
  const hasApi=apiConfig&&apiConfig.apiKey&&apiConfig.endpoint;

  const cancelAnalysis=()=>{
    if(abortRef.current){abortRef.current.abort();abortRef.current=null}
    setPhase(0);setProgress(0);setProgressText('\u51c6\u5907\u5206\u6790...');
  };

  // progress animation during real API call
  useEffect(()=>{
    if(phase===1){
      let p=0;
      const stages=[{at:15,t:'上传图片到 AI 模型...'},{at:30,t:'分析画面内容和主体...'},{at:50,t:'识别视觉风格和色彩...'},{at:70,t:'推算构图和镜头参数...'},{at:85,t:'生成中文 Prompt...'}];
      const iv=setInterval(()=>{p+=Math.random()*3+1;if(p>92)p=92;setProgress(Math.min(p,92));const s=stages.filter(x=>p>=x.at).pop();if(s)setProgressText(s.t)},300);
      return ()=>clearInterval(iv);
    }
  },[phase]);

  // animate tags after result
  useEffect(()=>{
    if(phase===2&&aiResult){
      const allTags=aiResult.tags||[];let i=0;setTagsShown([]);setPromptRevealed(false);setProgress(100);
      const iv=setInterval(()=>{if(i>=allTags.length){clearInterval(iv);setTimeout(()=>setPromptRevealed(true),300);return}setTagsShown(prev=>[...prev,allTags[i]]);i++},200);
      return ()=>clearInterval(iv);
    }
  },[phase,aiResult]);

  // paste from clipboard support
  useEffect(()=>{
    const handlePaste=(e)=>{
      const items=e.clipboardData?.items;
      if(!items)return;
      for(let i=0;i<items.length;i++){
        if(items[i].type.startsWith('image/')){
          e.preventDefault();
          const file=items[i].getAsFile();
          if(file){
            const reader=new FileReader();
            reader.onload=(ev)=>{
              const data=ev.target.result;
              setSelectedImg(data);
              
              doAnalysis(data);
            };
            reader.readAsDataURL(file);
          }
          break;
        }
      }
    };
    document.addEventListener('paste',handlePaste);
    return ()=>document.removeEventListener('paste',handlePaste);
  },[hasApi]);

  // drag and drop support
  const [dragOver,setDragOver]=useState(false);
  const handleDrop=(e)=>{
    e.preventDefault();e.stopPropagation();setDragOver(false);
    const file=e.dataTransfer?.files?.[0];
    if(file&&file.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=(ev)=>{const data=ev.target.result;setSelectedImg(data);doAnalysis(data)};
      reader.readAsDataURL(file);
    }
  };
  const handleDragOver=(e)=>{e.preventDefault();e.stopPropagation();setDragOver(true)};
  const handleDragLeave=(e)=>{e.preventDefault();e.stopPropagation();setDragOver(false)};

  const doAnalysis=async(base64Data)=>{
    // Demo mode usage limit check
    if(isDemoMode()){
      const uses=parseInt(localStorage.getItem('promptos_demo_uses'))||0;
      if(uses>=20){setErrorMsg('体验次数已用完（20/20）。请配置自己的 API Key 继续使用 AI 分析功能。');setPhase(-1);return}
      localStorage.setItem('promptos_demo_uses',String(uses+1));
    }
    setPhase(1);setProgress(0);setErrorMsg('');setAiResult(null);
    const controller=new AbortController();
    abortRef.current=controller;
    try{const result=await analyzeImage(base64Data,apiConfig,controller.signal);if(!controller.signal.aborted){setAiResult(result);setPhase(2)}}
    catch(err){if(err.name==='AbortError')return;setErrorMsg(err.message||'分析失败');setPhase(-1)}
  };

  const handleFile=(e)=>{
    const file=e.target?.files?.[0];
    if(file){const reader=new FileReader();reader.onload=(ev)=>{const data=ev.target.result;setSelectedImg(data);doAnalysis(data)};reader.readAsDataURL(file)}
  };
  const retry=()=>{if(selectedImg&&hasApi)doAnalysis(selectedImg);else setPhase(0)};
  const handleSaveResult=async()=>{
    if(!aiResult)return;const a=aiResult.analysis;
    const thumb=selectedImg?await createThumbnail(selectedImg):null;
    const newItem={id:Date.now(),user:true,title:(a.subject||'未命名').slice(0,20),prompt:aiResult.prompt,neg:aiResult.negPrompt||'',platform:selectedPlatform,
      params:{画幅:(a.suggestedParams&&a.suggestedParams[0])||'自动',画质:(a.suggestedParams&&a.suggestedParams[1])||'高清',风格:(a.suggestedParams&&a.suggestedParams[2])||'自动'},
      tags:aiResult.tags||[],rating:4,uses:0,note:'AI 自动生成，可编辑',date:new Date().toISOString().slice(0,10),folder:'未分类',seed:Math.floor(Math.random()*15),analysis:a,thumbnail:thumb};
    onSave(newItem);onClose();
  };

  const handleManualFile=(e)=>{
    const file=e.target?.files?.[0];
    if(file){const reader=new FileReader();reader.onload=(ev)=>{setManualImg(ev.target.result)};reader.readAsDataURL(file)}
  };
  const handleDecompose=async()=>{
    if(!manualPrompt.trim())return;
    const cfg=typeof getApiConfig==='function'?getApiConfig():null;
    if(!cfg||!cfg.apiKey)return;
    if(isDemoMode()){
      const uses=parseInt(localStorage.getItem('promptos_demo_uses'))||0;
      if(uses>=20){setDecomposeError('体验次数已用完（20/20），请配置自己的 API Key');return}
      localStorage.setItem('promptos_demo_uses',String(uses+1));
    }
    setDecomposing(true);setDecomposeError('');setDecomposeResult(null);
    const controller=new AbortController();
    decomposeAbortRef.current=controller;
    try{
      const result=await decomposePrompt(manualPrompt,manualImg,apiConfig,controller.signal);
      if(!controller.signal.aborted){setDecomposeResult(result);
        // Auto-fill tags if empty
        if(!manualTags.trim()&&result.tags){setManualTags(result.tags.join(', '))}
      }
    }catch(err){if(err.name!=='AbortError')setDecomposeError(err.message||'拆解失败')}
    finally{setDecomposing(false)}
  };

  const handleManualSave=async()=>{
    if(!manualPrompt.trim())return;
    const thumb=manualImg?await createThumbnail(manualImg):null;
    const newItem={id:Date.now(),user:true,title:(manualTitle||manualPrompt.slice(0,20)).slice(0,30),prompt:manualPrompt,neg:manualNeg,platform:'jimeng',
      params:{'\u753b\u5e45':manualRatio,'\u753b\u8d28':manualQuality,'\u98ce\u683c':manualStyle},
      tags:manualTags.split(',').map(s=>s.trim()).filter(Boolean),rating:3,uses:0,note:'手动录入',date:new Date().toISOString().slice(0,10),folder:'未分类',seed:Math.floor(Math.random()*15),analysis:decomposeResult?.analysis||null,thumbnail:thumb};
    onSave(newItem);onClose();
  };

  const analysisLabels=aiResult?[
    {cat:'内容层',items:[{l:'主体',v:aiResult.analysis.subject},{l:'人物',v:aiResult.analysis.character},{l:'环境',v:aiResult.analysis.env}]},
    {cat:'视觉层',items:[{l:'风格',v:aiResult.analysis.style},{l:'色彩',v:aiResult.analysis.color},{l:'构图',v:aiResult.analysis.comp},{l:'视角',v:aiResult.analysis.angle},{l:'镜头',v:aiResult.analysis.lens},{l:'光影',v:aiResult.analysis.light}]},
    {cat:'技术层',items:[{l:'推荐模型',v:(aiResult.analysis.models||[]).join(' / ')},{l:'建议参数',v:(aiResult.analysis.suggestedParams||[]).join(', ')}]},
  ]:[];

  return(
    <div className="anim-fade" style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',backdropFilter:'blur(20px) saturate(1.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200}}>
      <div className="anim-scale" onClick={e=>e.stopPropagation()}
        style={{width:phase===2?920:520,maxHeight:'90vh',background:'var(--surface)',borderRadius:18,boxShadow:'0 24px 80px rgba(0,0,0,.15),0 8px 24px rgba(0,0,0,.08)',display:'flex',flexDirection:phase===2?'row':'column',overflow:'hidden',transition:'width .35s cubic-bezier(.25,.1,.25,1)',border:'0.5px solid rgba(255,255,255,.5)'}}>

        {/* Phase 0: Upload */}
        {phase===0 && (
          <div style={{padding:32,overflowY:'auto',maxHeight:'90vh'}}>
            <div style={{textAlign:'center',marginBottom:24}}>
              <div style={{width:48,height:48,borderRadius:12,background:'var(--accent-bg)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12}}><IUpload size={22} color="var(--accent)" sw={1.8}/></div>
              <h2 style={{fontSize:18,fontWeight:600,letterSpacing:'-.02em'}}>{manualMode?'手动录入创作案例':'上传你的 AI 作品'}</h2>
              <p style={{color:'var(--text-3)',fontSize:13,marginTop:4}}>{manualMode?'记录你的 Prompt 和生成图，下次直接复用':'AI 视觉模型将自动分析图片并反推中文 Prompt'}</p>
            </div>
            {isDemoMode() && (
              <div style={{padding:'10px 14px',background:'rgba(0,122,255,.05)',border:'1px solid rgba(0,122,255,.12)',borderRadius:8,marginBottom:14,textAlign:'center'}}>
                <p style={{fontSize:12,color:'var(--accent)',margin:0,fontWeight:500}}>✨ 体验模式已启用，上传即可 AI 自动分析 <span style={{color:'var(--text-3)',fontWeight:400}}>(剩余 {20 - (parseInt(localStorage.getItem('promptos_demo_uses'))||0)} 次)</span></p>
              </div>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
            <div onClick={()=>fileRef.current?.click()}
              onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave}
              style={{border:dragOver?'2px solid var(--accent)':'1.5px dashed rgba(0,0,0,.15)',borderRadius:12,padding:40,textAlign:'center',cursor:'pointer',transition:'all .2s ease',
                background:dragOver?'var(--accent-bg)':'var(--bg)',opacity:1}}
              onMouseEnter={e=>{if(hasApi&&!dragOver){e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.background='var(--accent-bg)'}}}
              onMouseLeave={e=>{if(!dragOver){e.currentTarget.style.borderColor='rgba(0,0,0,.15)';e.currentTarget.style.background='var(--bg)'}}}>
              <IImage size={32} color="var(--text-3)"/>
              <p style={{marginTop:8,fontSize:13.5,fontWeight:500}}>点击、拖拽或粘贴图片</p>
              <p style={{fontSize:11,color:'var(--text-3)',marginTop:3}}>JPG, PNG, WebP · 最大 10MB</p>
              <p style={{fontSize:11,color:'var(--accent)',marginTop:6,display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                支持 Ctrl+V 直接粘贴截图
              </p>
            </div>
            {/* Toggle between AI mode and manual mode */}
            <div style={{textAlign:'center',marginTop:18,paddingTop:14,borderTop:'0.5px solid rgba(0,0,0,0.06)'}}>
              <button onClick={()=>setManualMode(!manualMode)}
                style={{fontSize:12,fontWeight:500,color:'var(--accent)',background:'none',border:'none',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:4,padding:'4px 12px',borderRadius:20,transition:'all .15s ease'}}
                onMouseEnter={e=>{e.currentTarget.style.background='var(--accent-bg)'}}
                onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}>
                {manualMode?'← 返回 AI 分析模式':'我已有 Prompt，直接录入 →'}
              </button>
            </div>

            {/* Manual entry form */}
            {manualMode && (
              <div style={{marginTop:16}}>
                <div style={{marginBottom:12}}>
                  <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>Prompt *</label>
                  <textarea value={manualPrompt} onChange={e=>setManualPrompt(e.target.value)} rows={4} placeholder="粘贴或输入你的提示词..." style={{width:'100%',padding:'8px 12px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12.5,lineHeight:1.7,resize:'vertical',fontFamily:'inherit',transition:'border-color .2s'}}
                    onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='rgba(0,0,0,.1)'}/>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>标题（可选）</label>
                  <input value={manualTitle} onChange={e=>setManualTitle(e.target.value)} placeholder="给这个案例起个名字" style={{width:'100%',padding:'7px 12px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12.5,fontFamily:'inherit',transition:'border-color .2s'}}
                    onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='rgba(0,0,0,.1)'}/>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>负向提示词（可选）</label>
                  <input value={manualNeg} onChange={e=>setManualNeg(e.target.value)} placeholder="不想要的元素，用顿号分隔" style={{width:'100%',padding:'7px 12px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12.5,fontFamily:'inherit',transition:'border-color .2s'}}
                    onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='rgba(0,0,0,.1)'}/>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>标签（可选，用逗号分隔）</label>
                  <input value={manualTags} onChange={e=>setManualTags(e.target.value)} placeholder="商品摄影, 产品设计, 写实" style={{width:'100%',padding:'7px 12px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12.5,fontFamily:'inherit',transition:'border-color .2s'}}
                    onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='rgba(0,0,0,.1)'}/>
                </div>
                <div style={{display:'flex',gap:8,marginBottom:12}}>
                  <div style={{flex:1}}>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>画幅</label>
                    <select value={manualRatio} onChange={e=>setManualRatio(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12,fontFamily:'inherit',cursor:'pointer'}}>
                      <option value="16:9">16:9 横幅</option>
                      <option value="9:16">9:16 竖幅</option>
                      <option value="1:1">1:1 方图</option>
                      <option value="3:4">3:4 竖版</option>
                      <option value="4:3">4:3 横版</option>
                      <option value="21:9">21:9 超宽</option>
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>画质</label>
                    <select value={manualQuality} onChange={e=>setManualQuality(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12,fontFamily:'inherit',cursor:'pointer'}}>
                      <option value="高清">高清</option>
                      <option value="超高清">超高清</option>
                      <option value="超高清8K">超高清 8K</option>
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>风格</label>
                    <select value={manualStyle} onChange={e=>setManualStyle(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'1px solid rgba(0,0,0,.1)',borderRadius:8,background:'var(--bg)',outline:'none',fontSize:12,fontFamily:'inherit',cursor:'pointer'}}>
                      <option value="写实">写实</option>
                      <option value="插画">插画</option>
                      <option value="3D渲染">3D 渲染</option>
                      <option value="动漫">动漫</option>
                      <option value="摄影">摄影</option>
                      <option value="油画">油画</option>
                    </select>
                  </div>
                </div>
                {/* AI Decompose button */}
                {hasApi && manualPrompt.trim() && (
                  <div style={{marginBottom:14}}>
                    <button onClick={handleDecompose} disabled={decomposing}
                      style={{width:'100%',padding:'9px 16px',borderRadius:8,fontSize:12.5,fontWeight:600,cursor:decomposing?'wait':'pointer',
                        display:'flex',alignItems:'center',justifyContent:'center',gap:6,
                        background:decomposeResult?'var(--emerald)':'linear-gradient(135deg,var(--accent),#5856D6)',
                        color:'#fff',border:'none',transition:'all .2s ease',
                        boxShadow:'0 2px 8px rgba(0,122,255,.2)'}}
                      onMouseEnter={e=>{if(!decomposing)e.currentTarget.style.boxShadow='0 4px 12px rgba(0,122,255,.3)'}}
                      onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 2px 8px rgba(0,122,255,.2)'}}>
                      {decomposing?'AI 拆解中...':decomposeResult?'已拆解，点击重新分析':'AI 智能拆解 Prompt'}
                    </button>
                    {decomposeError&&<p style={{fontSize:11,color:'var(--rose)',marginTop:4}}>{decomposeError}</p>}
                    {/* Decomposition results preview */}
                    {decomposeResult&&decomposeResult.analysis&&(
                      <div style={{marginTop:10,padding:'12px 14px',background:'var(--bg)',borderRadius:10,border:'1px solid var(--border-light)'}}>
                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>AI 拆解结果</div>
                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                          {[
                            {l:'主体',v:decomposeResult.analysis.subject,e:'🎯'},
                            {l:'人物',v:decomposeResult.analysis.character,e:'👤'},
                            {l:'环境',v:decomposeResult.analysis.env,e:'🏞️'},
                            {l:'风格',v:decomposeResult.analysis.style,e:'🎨'},
                            {l:'色彩',v:decomposeResult.analysis.color,e:'🌈'},
                            {l:'构图',v:decomposeResult.analysis.comp,e:'📷'},
                            {l:'视角',v:decomposeResult.analysis.angle,e:'👁️'},
                            {l:'镜头',v:decomposeResult.analysis.lens,e:'🔍'},
                            {l:'光影',v:decomposeResult.analysis.light,e:'☀️'},
                          ].map((x,i)=>(
                            <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start',fontSize:11.5,lineHeight:1.5}}>
                              <span style={{flexShrink:0,fontSize:13}}>{x.e}</span>
                              <span style={{fontWeight:600,color:'var(--text-3)',flexShrink:0,width:32}}>{x.l}</span>
                              <span style={{color:x.v==='—'||x.v==='-'?'var(--text-3)':'var(--text)'}}>{x.v||'—'}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
                <div style={{marginBottom:14}}>
                  <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>生成图片（可选）</label>
                  <input ref={manualFileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleManualFile}/>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    {manualImg?(
                      <div style={{position:'relative',display:'inline-block'}}>
                        <img src={manualImg} alt="" style={{width:80,height:80,borderRadius:8,objectFit:'cover',border:'1px solid rgba(0,0,0,.08)'}}/>
                        <button onClick={()=>setManualImg(null)} style={{position:'absolute',top:-6,right:-6,width:20,height:20,borderRadius:'50%',background:'var(--rose)',color:'#fff',border:'none',cursor:'pointer',fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}><IX size={11}/></button>
                      </div>
                    ):(
                      <button onClick={()=>manualFileRef.current?.click()} style={{padding:'8px 16px',borderRadius:8,fontSize:12,fontWeight:500,color:'var(--text-2)',background:'var(--bg)',border:'1.5px dashed rgba(0,0,0,.12)',cursor:'pointer',display:'flex',alignItems:'center',gap:6,transition:'all .15s'}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)'}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(0,0,0,.12)';e.currentTarget.style.color='var(--text-2)'}}>
                        <IImage size={15}/> 上传图片
                      </button>
                    )}
                  </div>
                </div>
                <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                  <button onClick={onClose} className="btn-ghost">取消</button>
                  <button onClick={handleManualSave} disabled={!manualPrompt.trim()} style={{padding:'8px 22px',borderRadius:8,fontSize:13,fontWeight:600,cursor:manualPrompt.trim()?'pointer':'not-allowed',
                    background:manualPrompt.trim()?'var(--accent)':'rgba(0,0,0,.06)',color:'#fff',border:'none',transition:'all .15s ease',
                    opacity:manualPrompt.trim()?1:.5}}>
                    保存到库
                  </button>
                </div>
              </div>
            )}

            {!manualMode && (
            <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
              <button onClick={onClose} className="btn-ghost">取消</button>
            </div>
            )}
          </div>
        )}

        {/* Phase -1: Error */}
        {phase===-1 && (
          <div style={{padding:32}}>
            <div style={{textAlign:'center',marginBottom:20}}>
              {selectedImg && <img src={selectedImg} alt="" style={{width:140,height:100,objectFit:'cover',borderRadius:8,marginBottom:14,boxShadow:'var(--shadow-sm)',opacity:.6}}/>}
              <div style={{width:44,height:44,borderRadius:12,background:'rgba(255,59,48,.08)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:10}}>
                <IX size={20} color="var(--rose)"/>
              </div>
              <h2 style={{fontSize:16,fontWeight:600,color:'var(--rose)',letterSpacing:'-.02em'}}>分析失败</h2>
              <p style={{color:'var(--text-2)',fontSize:13,marginTop:6,lineHeight:1.5}}>{errorMsg}</p>
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              {errorMsg.includes('配置')||errorMsg.includes('Key')?(
                <button onClick={onOpenSettings} className="btn-primary">打开 API 设置</button>
              ):(
                <button onClick={retry} className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}}><IRefresh size={14} color="#fff"/> 重试</button>
              )}
              <button onClick={()=>setPhase(0)} className="btn-ghost">重新上传</button>
              <button onClick={onClose} className="btn-ghost">取消</button>
            </div>
          </div>
        )}

        {/* Phase 1: Analyzing */}
        {phase===1 && (
          <div style={{padding:32}}>
            <div style={{textAlign:'center',marginBottom:28}}>
              {selectedImg && <img src={selectedImg} alt="" style={{width:180,height:130,objectFit:'cover',borderRadius:10,marginBottom:16,boxShadow:'var(--shadow-md)'}}/>}
              <div style={{width:44,height:44,borderRadius:12,background:'var(--accent-bg)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:14,animation:'glowPulse 2s infinite'}}>
                <ISparkle size={22} color="var(--accent)"/>
              </div>
              <h2 style={{fontSize:17,fontWeight:600,letterSpacing:'-.02em'}}>AI 正在解析你的作品...</h2>
              <p style={{color:'var(--text-3)',fontSize:12,marginTop:4}}>{progressText}</p>
            </div>
            <div style={{width:'100%',height:4,background:'var(--surface-alt)',borderRadius:2,overflow:'hidden',marginBottom:10}}>
              <div style={{width:`${progress}%`,height:'100%',background:'linear-gradient(90deg,var(--accent),#5856D6)',borderRadius:2,transition:'width .3s ease'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-3)'}}>
              <span>使用 {apiConfig?.model||'AI'} 视觉模型</span>
              <span>{Math.round(progress)}%</span>
            </div>
            <div style={{display:'flex',justifyContent:'center',marginTop:16}}>
              <button onClick={cancelAnalysis} style={{padding:'6px 18px',borderRadius:8,fontSize:12,fontWeight:500,color:'var(--text-2)',background:'var(--bg)',border:'1px solid rgba(0,0,0,.08)',cursor:'pointer',display:'flex',alignItems:'center',gap:5,transition:'all .15s ease'}}
                onMouseEnter={e=>{e.currentTarget.style.background='rgba(0,0,0,.04)';e.currentTarget.style.borderColor='rgba(0,0,0,.15)'}}
                onMouseLeave={e=>{e.currentTarget.style.background='var(--bg)';e.currentTarget.style.borderColor='rgba(0,0,0,.08)'}}>
                <IX size={13}/> 取消分析
              </button>
            </div>
          </div>
        )}

        {/* Phase 2: Real AI Results */}
        {phase===2 && aiResult && (
          <Fragment>
            {/* Left: Image + Tags */}
            <div style={{width:360,flexShrink:0,padding:24,display:'flex',flexDirection:'column',borderRight:'0.5px solid rgba(0,0,0,0.06)',overflowY:'auto'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
                <div style={{padding:'4px 10px',borderRadius:6,background:'#ECFDF5',color:'#10B981',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:4}}>
                  <ICheck size={13}/> AI 解析完成
                </div>
                <span style={{fontSize:10,color:'var(--text-3)',marginLeft:'auto'}}>{apiConfig?.model}</span>
              </div>
              <img src={selectedImg} alt="" style={{width:'100%',borderRadius:14,boxShadow:'var(--shadow-md)',marginBottom:16}}/>

              {/* Auto Tags */}
              <div style={{marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>AI 自动标签</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {tagsShown.map((t,i)=>(
                    <span key={t} className="anim-tag" style={{animationDelay:`${i*0.05}s`,padding:'5px 12px',borderRadius:20,fontSize:11.5,fontWeight:600,
                      background:['var(--accent-bg)','#FEF3C7','#ECFDF5','#FEE2E2'][i%4],
                      color:['var(--accent)','#B45309','#059669','#DC2626'][i%4]}}>#{t}</span>
                  ))}
                </div>
              </div>

              <div style={{flex:1}}/>
              <div style={{display:'flex',gap:8,flexShrink:0}}>
                <button onClick={handleSaveResult} className="btn-primary" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                  <IBookmark size={15} color="#fff"/> 保存到库
                </button>
                <button onClick={onClose} className="btn-ghost">关闭</button>
              </div>
            </div>

            {/* Right: Analysis */}
            <div style={{flex:1,overflowY:'auto',padding:28}}>
              <h3 style={{fontSize:18,fontWeight:700,marginBottom:4}}>AI 视觉解析</h3>
              <p style={{color:'var(--text-3)',fontSize:12,marginBottom:24}}>基于 {apiConfig?.model||'视觉模型'} 的多维度深度分析</p>

              {/* Analysis Sections */}
              {analysisLabels.map((sec,si)=>(
                <div key={sec.cat} className="anim-up" style={{animationDelay:`${si*0.1}s`,marginBottom:24}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                    <div style={{width:8,height:8,borderRadius:2,background:['var(--accent)','var(--violet)','var(--emerald)'][si]}}/>
                    <span style={{fontSize:13,fontWeight:700,color:['var(--accent)','var(--violet)','var(--emerald)'][si]}}>{sec.cat}</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:8}}>
                    {sec.items.map(it=>(
                      <div key={it.l} style={{padding:'10px 14px',background:'var(--bg)',borderRadius:10,border:'1px solid var(--border-light)'}}>
                        <div style={{fontSize:10,fontWeight:600,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.3px'}}>{it.l}</div>
                        <div style={{fontSize:13,fontWeight:600,marginTop:3,color:'var(--text)'}}>{it.v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}

              {/* Generated Prompt */}
              {promptRevealed && (
                <div className="anim-up" style={{marginTop:8}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                    <ISparkle size={16} color="var(--accent)"/>
                    <span style={{fontSize:13,fontWeight:700,color:'var(--accent)'}}>生成的中文 Prompt</span>
                  </div>
                  <div style={{padding:16,background:'var(--accent-bg)',borderRadius:12,border:'1px solid var(--accent-border)',lineHeight:1.8,fontSize:13,color:'var(--text)',position:'relative'}}>
                    {aiResult.prompt}
                    <button onClick={()=>{navigator.clipboard?.writeText(aiResult.prompt);setCopied(true);setTimeout(()=>setCopied(false),2000)}}
                      style={{position:'absolute',top:10,right:10,padding:'5px 10px',borderRadius:6,background:'var(--surface)',border:'1px solid var(--accent-border)',display:'flex',alignItems:'center',gap:4,fontSize:11,fontWeight:600,color:copied?'var(--emerald)':'var(--accent)'}}>
                      {copied?<ICheck size={12}/>:<ICopy size={12}/>} {copied?'已复制':'复制'}
                    </button>
                  </div>
                  {aiResult.negPrompt && (
                    <div style={{marginTop:12}}>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>负向提示词</div>
                      <div style={{padding:12,background:'#FFF5F5',borderRadius:10,fontSize:12.5,lineHeight:1.6,color:'#C0392B',border:'1px solid #FDECEC'}}>{aiResult.negPrompt}</div>
                    </div>
                  )}
                  <div style={{display:'flex',gap:8,marginTop:14}}>
                    <button className="btn-ghost" style={{display:'flex',alignItems:'center',gap:6,flex:1}}>
                      <IWand size={14}/> AI 优化
                    </button>
                    <button onClick={retry} className="btn-ghost" style={{display:'flex',alignItems:'center',gap:6,flex:1}}>
                      <IRefresh size={14}/> 重新分析
                    </button>
                  </div>
                </div>
              )}
            </div>
          </Fragment>
        )}
      </div>
    </div>
  );
};

/* ─── Settings Modal ─── */
const SettingsModal=({onClose,apiConfig,setApiConfig})=>{
  const [preset,setPreset]=useState(()=>{const c=getApiConfig();return c?.presetId||'qwen37'});
  const [endpoint,setEndpoint]=useState(apiConfig?.endpoint||API_PRESETS[0].endpoint);
  const [model,setModel]=useState(apiConfig?.model||API_PRESETS[0].model);
  const [apiKey,setApiKey]=useState(apiConfig?.apiKey||'');
  const [saved,setSaved]=useState(false);
  const selectPreset=(id)=>{setPreset(id);const p=API_PRESETS.find(x=>x.id===id);if(p&&p.id!=='custom'){setEndpoint(p.endpoint);setModel(p.model);const cfg={presetId:id,endpoint:p.endpoint,model:p.model,apiKey:apiKey.trim()};if(apiKey.trim())setApiConfig(cfg)}};
  const handleSave=()=>{const cfg={presetId:preset,endpoint,model,apiKey:apiKey.trim()};saveApiConfig(cfg);setApiConfig(cfg);setSaved(true);setTimeout(()=>{setSaved(false);onClose()},1200)};
  return(
    <div className="anim-fade" style={{position:'fixed',inset:0,background:'rgba(0,0,0,.3)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}} onClick={onClose}>
      <div className="anim-scale" onClick={e=>e.stopPropagation()} style={{width:500,background:'var(--surface)',borderRadius:14,boxShadow:'var(--shadow-lg)',overflow:'hidden'}}>
        <div style={{padding:'20px 24px 14px',display:'flex',alignItems:'center',borderBottom:'0.5px solid rgba(0,0,0,0.06)'}}>
          <div><h3 style={{fontSize:16,fontWeight:600,letterSpacing:'-.02em'}}>AI API 设置</h3><p style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{isDemoMode()?'当前为体验模式，使用内置演示 Key':'配置视觉模型来启用真实的图片分析能力'}</p></div>
          <div style={{flex:1}}/>
          <button onClick={onClose} style={{color:'var(--text-3)',padding:4,borderRadius:6,display:'flex',transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(0,0,0,.04)'}} onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}><IX size={17}/></button>
        </div>
        <div style={{padding:'18px 24px',maxHeight:'60vh',overflowY:'auto'}}>
          {isDemoMode()&&(
            <div style={{marginBottom:14,padding:'10px 14px',background:'rgba(0,122,255,.06)',border:'1px solid rgba(0,122,255,.15)',borderRadius:8,display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{fontSize:14,flexShrink:0}}>ℹ️</span>
              <div>
                <p style={{fontSize:12,fontWeight:600,color:'var(--accent)',margin:0,lineHeight:1.4}}>体验模式</p>
                <p style={{fontSize:11,color:'var(--text-2)',margin:'4px 0 0',lineHeight:1.5}}>当前使用内置演示 Key，功能完整但有调用限制。如需长期使用，建议在百炼平台申请自己的免费 API Key。</p>
              </div>
            </div>
          )}
          <div style={{marginBottom:18}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:6,letterSpacing:'.1px'}}>选择 AI 平台</label>
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {API_PRESETS.map(p=>(
                <button key={p.id} onClick={()=>selectPreset(p.id)}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,textAlign:'left',fontSize:13,transition:'all .15s ease',
                    background:preset===p.id?'var(--accent-bg)':'var(--bg)',border:preset===p.id?'1.5px solid var(--accent)':'1px solid rgba(0,0,0,0.06)',
                    fontWeight:preset===p.id?600:400,color:preset===p.id?'var(--accent)':'var(--text)',letterSpacing:'-.01em'}}>
                  <div style={{width:18,height:18,borderRadius:'50%',border:preset===p.id?'2px solid var(--accent)':'2px solid rgba(0,0,0,.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {preset===p.id&&<div style={{width:8,height:8,borderRadius:'50%',background:'var(--accent)'}}/>}
                  </div>
                  <div style={{flex:1}}><div>{p.name}</div>{p.hint&&<div style={{fontSize:10,color:'var(--text-3)',marginTop:1,fontWeight:400}}>{p.hint}{p.url&&<a href={p.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{color:'var(--accent)',marginLeft:4,textDecoration:'none',fontWeight:500}} onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'} onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>{'\u2197 \u83b7\u53d6 Key'}</a>}</div>}</div>
                </button>
              ))}
            </div>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text-3)',marginBottom:5,letterSpacing:'.1px'}}>API 地址</label>
            <input value={endpoint} onChange={e=>setEndpoint(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'1px solid rgba(0,0,0,.1)',borderRadius:6,background:'var(--bg)',outline:'none',fontSize:12,fontFamily:'monospace',color:'var(--text)',transition:'border-color .2s ease'}} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='rgba(0,0,0,.1)'}/>
          </div>

  const [editingModuleVal,setEditingModuleVal]=useState('');

  const initModules=()=>{
    const a=item.analysis;
    if(!a)return;
    setEditModules({
      '主体':a.subject||'',
      '人物':a.character||'',
      '环境':a.env||'',
      '风格':a.style||'',
      '色彩':a.color||'',

      '镜头':a.lens||'',
      '光影':a.light||'',
    });
    setModuleEditing(true);
    setReassembledPrompt(null);
  };

  const handleReassemble=async()=>{
    if(!editModules)return;
    const cfg=typeof getApiConfig==='function'?getApiConfig():null;
    if(!cfg||!cfg.apiKey)return;
    if(isDemoMode()){
      const uses=parseInt(localStorage.getItem('promptos_demo_uses'))||0;
      if(uses>=20){alert('体验次数已用完（20/20），请配置自己的 API Key');return}
      localStorage.setItem('promptos_demo_uses',String(uses+1));
    }
    setReassembling(true);setReassembledPrompt(null);
    const controller=new AbortController();
    reassembleAbortRef.current=controller;
    try{
      const result=await reassemblePrompt(editModules,item.prompt,cfg,controller.signal);
      if(!controller.signal.aborted)setReassembledPrompt(result);

                              {'\u8d1f\u5411: '}{ver.neg}
                            </div>
                          )}
                          {ver.params&&Object.keys(ver.params).length>0&&(
                            <div style={{marginTop:4,display:'flex',flexWrap:'wrap',gap:4}}>
                              {Object.entries(ver.params).map(([k,v])=>(
                                <span key={k} style={{padding:'2px 8px',borderRadius:12,fontSize:10,background:'var(--surface-alt)',color:'var(--text-3)',border:'1px solid var(--border-light)'}}>
                                  {k}: {String(v)}
                                </span>
                              ))}
                            </div>
                          )}
                        </details>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab==='notes' && (
          <div className="anim-fade">
            <div style={{marginBottom:16}}>
              <span style={labelStyle}>{'\u7b14\u8bb0'}</span>
              {editing?(
                <textarea value={editData.note} onChange={e=>setEditData(d=>({...d,note:e.target.value}))} rows={4} style={{...inpStyle,lineHeight:1.8,resize:'vertical'}}/>
              ):(
                <div style={{padding:16,background:'var(--bg)',borderRadius:10,border:'1px solid var(--border-light)',lineHeight:1.8,fontSize:13,color:'var(--text-2)'}}>
                  {item.note||'\u6682\u65e0\u7b14\u8bb0'}
                </div>
              )}
            </div>
            <div>
              <span style={labelStyle}>{'\u6807\u7b7e'}</span>
              {editing?(
                <input value={editData.tags} onChange={e=>setEditData(d=>({...d,tags:e.target.value}))} placeholder={'\u7528\u9017\u53f7\u5206\u9694'} style={{...inpStyle,marginTop:4}}/>
              ):(
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
                  {item.tags.map(t=><span key={t} className="tag" style={{background:'var(--surface-alt)',color:'var(--text-2)',padding:'3px 10px',borderRadius:20,fontSize:11}}>#{t}</span>)}
                </div>
              )}
            </div>
          </div>
        )}

            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ─── Library Page ─── */
const Library=({items,viewingItem,setViewingItem,onUpdate,onDelete,folderFilter,setFolderFilter,batchMode,setBatchMode,selectedIds,toggleBatchSelect,selectAll,onBatchDelete,allFolders,onBatchMoveFolder})=>{
  const [platFilter,setPlatFilter]=useState('all');
  const [tagFilter,setTagFilter]=useState('all');
  const [sort,setSort]=useState('date');
  const [showMoveMenu,setShowMoveMenu]=useState(false);
  const [tagsExpanded,setTagsExpanded]=useState(false);
  const allTags=[...new Set(items.flatMap(i=>i.tags))];

  const filtered=useMemo(()=>{
    let r=[...items];
    if(platFilter!=='all')r=r.filter(i=>i.platform===platFilter);
    if(tagFilter!=='all')r=r.filter(i=>i.tags.includes(tagFilter));
    if(sort==='date')r.sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(sort==='uses')r.sort((a,b)=>b.uses-a.uses);

  const chipBtn=(active,onClick,children)=>({
    padding:'4px 11px',borderRadius:20,fontSize:11.5,fontWeight:active?600:400,cursor:'pointer',transition:'all .15s ease',letterSpacing:'-.01em',
    background:active?'var(--accent)':'var(--surface)',color:active?'#fff':'var(--text-2)',
    border:active?'1px solid var(--accent)':'1px solid rgba(0,0,0,.08)',
  });

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Filter bar */}
      <div style={{padding:'10px 20px',borderBottom:'0.5px solid rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:6,flexShrink:0,flexWrap:'wrap'}}>
        {folderFilter&&(
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 10px',background:'var(--accent-bg)',borderRadius:20,border:'1px solid var(--accent-border)'}}>
            <span style={{fontSize:11.5,fontWeight:500,color:'var(--accent)'}}>{'\ud83d\udcc1'} {folderFilter}</span>
            <button onClick={()=>setFolderFilter(null)} style={{color:'var(--accent)',padding:0,lineHeight:1}}><IX size={12}/></button>
          </div>
        )}
        <div style={{width:1,height:18,background:'rgba(0,0,0,.08)',margin:'0 4px'}}/>
        <button onClick={()=>setTagsExpanded(!tagsExpanded)} style={{padding:'4px 11px',borderRadius:20,fontSize:11.5,fontWeight:tagFilter!=='all'?600:500,cursor:'pointer',transition:'all .15s ease',
          background:tagFilter!=='all'?'var(--accent)':'var(--surface)',color:tagFilter!=='all'?'#fff':'var(--text-2)',
          border:tagFilter!=='all'?'1px solid var(--accent)':'1px solid rgba(0,0,0,.08)',display:'flex',alignItems:'center',gap:4}}>
          {'# 标签'}{tagFilter!=='all'&&<span style={{background:'rgba(255,255,255,.3)',borderRadius:10,padding:'0 5px',fontSize:10}}>{tagFilter}</span>}
          <span style={{display:'inline-flex',transform:tagsExpanded?'rotate(180deg)':'rotate(0)',transition:'transform .2s ease'}}><IDown size={12}/></span>
        </button>
        <div style={{width:1,height:18,background:'rgba(0,0,0,.08)',margin:'0 4px'}}/>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{padding:'4px 10px',border:'1px solid rgba(0,0,0,.08)',borderRadius:20,background:'var(--surface)',fontSize:11.5,color:'var(--text-2)',outline:'none',cursor:'pointer',fontWeight:500}}>
          <option value="date">{'\u6700\u65b0\u66f4\u65b0'}</option>
          <option value="uses">{'\u4f7f\u7528\u6700\u591a'}</option>
        </select>
        <div style={{flex:1}}/>
        <span style={{fontSize:11.5,color:'var(--text-3)',fontWeight:500}}>{filtered.length} {'\u6761\u7ed3\u679c'}</span>
        <button onClick={()=>{setBatchMode(!batchMode);setSelectedIds&&selectedIds.clear&&null}}
          style={{padding:'4px 12px',borderRadius:20,fontSize:11.5,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:4,
            background:batchMode?'var(--accent-bg)':'transparent',color:batchMode?'var(--accent)':'var(--text-2)',
            border:batchMode?'1px solid var(--accent-border)':'1px solid rgba(0,0,0,.08)',transition:'all .15s ease'}}>
          {batchMode?'\u9000\u51fa\u6279\u91cf':'\u6279\u91cf'}
        </button>
      </div>

      {/* Collapsible tag filter */}
      {tagsExpanded&&(
        <div className="anim-fade" style={{padding:'8px 20px',borderBottom:'0.5px solid rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',flexShrink:0}}>
          <button onClick={()=>setTagFilter('all')} style={chipBtn(tagFilter==='all')}>全部</button>
          {allTags.map(t=>(
            <button key={t} onClick={()=>setTagFilter(t===tagFilter?'all':t)} style={chipBtn(tagFilter===t)}>#{t}</button>
          ))}
        </div>
      )}

      {/* Batch action bar */}
      {batchMode&&(
        <div style={{padding:'8px 20px',background:'var(--accent-bg)',borderBottom:'0.5px solid var(--accent-border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={selectAll} style={{fontSize:12,fontWeight:500,color:'var(--accent)',padding:'4px 10px',borderRadius:20,background:'var(--surface)',border:'1px solid var(--accent-border)',cursor:'pointer'}}>
            {selectedIds.size===filtered.length&&filtered.length>0?'\u53d6\u6d88\u5168\u9009':'\u5168\u9009'}
          </button>
          <span style={{fontSize:12,color:'var(--text-2)'}}>{'\u5df2\u9009'} <strong style={{color:'var(--accent)'}}>{selectedIds.size}</strong> {'\u9879'}</span>
          <div style={{flex:1}}/>
          <div style={{position:'relative'}}>
            <button onClick={()=>setShowMoveMenu(!showMoveMenu)} disabled={selectedIds.size===0}
              style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:500,cursor:selectedIds.size===0?'not-allowed':'pointer',
                background:selectedIds.size===0?'rgba(0,0,0,.03)':'var(--surface)',color:selectedIds.size===0?'var(--text-3)':'var(--accent)',
                border:selectedIds.size===0?'1px solid rgba(0,0,0,.06)':'1px solid var(--accent-border)',display:'flex',alignItems:'center',gap:4}}>
              <IFolder size={13}/> {'\u79fb\u52a8\u5230'}
            </button>
            {showMoveMenu&&selectedIds.size>0&&(
              <div className="anim-fade" style={{position:'absolute',top:'100%',right:0,marginTop:4,background:'var(--surface)',borderRadius:10,border:'0.5px solid rgba(0,0,0,0.1)',boxShadow:'var(--shadow-lg)',minWidth:180,zIndex:50,padding:4}}>
                {allFolders&&allFolders.map(f=>(
                  <button key={f.name} onClick={()=>{onBatchMoveFolder(f.name);setShowMoveMenu(false)}}
                    style={{width:'100%',padding:'7px 10px',fontSize:12.5,textAlign:'left',borderRadius:6,display:'flex',alignItems:'center',gap:8,cursor:'pointer',transition:'all .1s ease'}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--accent-bg)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <span>{f.icon}</span><span style={{fontWeight:500}}>{f.name}</span>
                  </button>
                ))}
                <button onClick={()=>{onBatchMoveFolder('\u672a\u5206\u7c7b');setShowMoveMenu(false)}}
                  style={{width:'100%',padding:'7px 10px',fontSize:12.5,textAlign:'left',borderRadius:6,display:'flex',alignItems:'center',gap:8,cursor:'pointer',transition:'all .1s ease',borderTop:'0.5px solid rgba(0,0,0,0.06)',marginTop:2,paddingTop:9}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--accent-bg)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span>{'\ud83d\udcc2'}</span><span style={{fontWeight:500}}>{'\u672a\u5206\u7c7b'}</span>
                </button>
              </div>
            )}
          </div>
          <button onClick={onBatchDelete} disabled={selectedIds.size===0}
            style={{padding:'4px 14px',borderRadius:20,fontSize:12,fontWeight:500,cursor:selectedIds.size===0?'not-allowed':'pointer',
              background:selectedIds.size===0?'rgba(0,0,0,.03)':'var(--rose)',color:selectedIds.size===0?'var(--text-3)':'#fff',border:'none',display:'flex',alignItems:'center',gap:4}}>
            <ITrash size={13} color={selectedIds.size===0?'var(--text-3)':'#fff'}/> {'\u5220\u9664\u9009\u4e2d'}
          </button>
        </div>
      )}

      {/* Masonry grid */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',gap:0}}>
        <div style={{flex:1}}>
          {filtered.length===0?(
            <div style={{textAlign:'center',padding:'80px 20px',color:'var(--text-3)'}}>
              <IGrid size={36} color="var(--text-3)"/>
              <p style={{marginTop:12,fontSize:13}}>{'\u6ca1\u6709\u627e\u5230\u5339\u914d\u7684 Prompt'}</p>
            </div>
          ):(
            <div style={{columnCount:4,columnGap:12}}>
              {filtered.map((item,i)=>(
                <div key={item.id} style={{breakInside:'avoid',marginBottom:12,position:'relative'}}>
                  {batchMode&&(
                    <div onClick={(e)=>{e.stopPropagation();toggleBatchSelect(item.id)}}
                      style={{position:'absolute',top:10,left:10,zIndex:10,width:22,height:22,borderRadius:6,cursor:'pointer',
                        background:selectedIds.has(item.id)?'var(--accent)':'rgba(255,255,255,.9)',
                        border:selectedIds.has(item.id)?'none':'2px solid var(--border)',
                        display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',boxShadow:'var(--shadow-xs)'}}>
                      {selectedIds.has(item.id)&&<ICheck size={13} color="#fff" sw={2.5}/>}
                    </div>
                  )}
                  <PCard item={item} i={i} onClick={batchMode?()=>toggleBatchSelect(item.id):setViewingItem}/>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

/* ─── Prompt Editor Page ─── */

const Editor=({apiConfig,onOpenSettings})=>{
  const [selected,setSelected]=useState({subject:null,env:null,style:null,lens:null,params:null});
  const [customText,setCustomText]=useState({subject:'',env:'',style:'',lens:'',params:''});
  const [generated,setGenerated]=useState('');
  const [aiResult,setAiResult]=useState(null);
  const [optimizing,setOptimizing]=useState(false);
  const [optimizeError,setOptimizeError]=useState('');
  const [copiedOpt,setCopiedOpt]=useState(false);
  const [copiedNeg,setCopiedNeg]=useState(false);

  const categories=[
    {key:'subject',label:'主体',icon:<ITarget size={15}/>,color:'var(--accent)',items:BLOCKS.subject},
    {key:'env',label:'环境',icon:<ISun size={15}/>,color:'var(--violet)',items:BLOCKS.env},
    {key:'style',label:'风格',icon:<IPalette size={15}/>,color:'var(--rose)',items:BLOCKS.style},
    {key:'lens',label:'镜头',icon:<ICamera size={15}/>,color:'var(--sky)',items:BLOCKS.lens},
    {key:'params',label:'参数',icon:<ISliders size={15}/>,color:'var(--emerald)',items:BLOCKS.params},
  ];

  useEffect(()=>{
    const parts=[];
    categories.forEach(cat=>{
      const selId=selected[cat.key];
      if(!selId)return;
      if(selId===`custom_${cat.key}`){
        if(customText[cat.key]?.trim())parts.push(customText[cat.key].trim());
      } else {
        const block=cat.items.find(b=>b.id===selId);
        if(block)parts.push(block.text);
      }
    });
    setGenerated(parts.join(', '));
    setAiResult(null);
  },[selected,customText]);

  const handleOptimize=async()=>{
    if(!generated)return;
    const hasApi=apiConfig&&apiConfig.apiKey&&apiConfig.endpoint;
    if(!hasApi){setOptimizeError('请先点击右上角「AI 设置」配置 API Key');return}
    setOptimizing(true);setOptimizeError('');setAiResult(null);
    try{
      const result=await optimizePromptWithAI(generated,apiConfig);
      setAiResult(result);
    }catch(e){setOptimizeError(e.message||'AI 优化失败')}
    finally{setOptimizing(false)}
  };

  const copyText=(text,setter)=>{navigator.clipboard?.writeText(text);setter(true);setTimeout(()=>setter(false),2000)};

  return(
    <div className="anim-up" style={{height:'100%',overflowY:'auto',padding:28}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:700,letterSpacing:'-.4px'}}>Prompt 编辑器</h2>
        <p style={{color:'var(--text-3)',fontSize:13,marginTop:3,fontWeight:400}}>像搭积木一样组合 Prompt 模块，或自由输入自定义描述</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
        {/* Left: Block selectors */}
        <div>
          {categories.map((cat,ci)=>{
            const isCustom=selected[cat.key]===`custom_${cat.key}`;
            return(
            <div key={cat.key} className="anim-up" style={{animationDelay:`${ci*0.05}s`,marginBottom:18}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                <div style={{width:26,height:26,borderRadius:6,background:cat.color+'14',display:'flex',alignItems:'center',justifyContent:'center',color:cat.color}}>{cat.icon}</div>
                <span style={{fontSize:13.5,fontWeight:600,letterSpacing:'-.01em'}}>{cat.label}</span>
                {selected[cat.key]&&<span style={{fontSize:10,color:'var(--emerald)',fontWeight:500,marginLeft:2,display:'flex',alignItems:'center',gap:3}}><ICheck size={11}/> 已选择</span>}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {cat.items.map(block=>{
                  const isSelected=selected[cat.key]===block.id;
                  return(
                    <button key={block.id} onClick={()=>setSelected(prev=>({...prev,[cat.key]:isSelected?null:block.id}))}
                      style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,textAlign:'left',fontSize:13,transition:'all .15s ease',
                        background:isSelected?cat.color+'0A':'var(--surface)',
                        border:isSelected?`1.5px solid ${cat.color}40`:'1px solid rgba(0,0,0,0.06)',
                        fontWeight:isSelected?500:400,color:isSelected?cat.color:'var(--text)',letterSpacing:'-.01em'}}
                      onMouseEnter={e=>{if(!isSelected)e.currentTarget.style.borderColor='rgba(0,0,0,.12)'}}
                      onMouseLeave={e=>{if(!isSelected)e.currentTarget.style.borderColor='rgba(0,0,0,0.06)'}}>
                      <span style={{fontSize:16}}>{block.emoji}</span>
                      <span style={{flex:1}}>{block.text}</span>
                      {isSelected&&<div style={{width:18,height:18,borderRadius:'50%',background:cat.color,display:'flex',alignItems:'center',justifyContent:'center'}}><ICheck size={11} color="#fff" sw={2.5}/></div>}
                    </button>
                  );
                })}
                {/* Custom input option */}
                <button onClick={()=>setSelected(prev=>({...prev,[cat.key]:isCustom?null:`custom_${cat.key}`}))}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,textAlign:'left',fontSize:13,transition:'all .15s ease',
                    background:isCustom?cat.color+'0A':'var(--surface)',
                    border:isCustom?`1.5px solid ${cat.color}40`:'1px dashed rgba(0,0,0,0.12)',
                    fontWeight:isCustom?500:400,color:isCustom?cat.color:'var(--text-3)',letterSpacing:'-.01em'}}
                  onMouseEnter={e=>{if(!isCustom)e.currentTarget.style.borderColor='var(--accent-border)'}}
                  onMouseLeave={e=>{if(!isCustom)e.currentTarget.style.borderColor='rgba(0,0,0,0.12)'}}>
                  <span style={{fontSize:16}}>✏️</span>
                  <span style={{flex:1}}>自定义输入...</span>
                  {isCustom&&<div style={{width:18,height:18,borderRadius:'50%',background:cat.color,display:'flex',alignItems:'center',justifyContent:'center'}}><ICheck size={11} color="#fff" sw={2.5}/></div>}
                </button>
                {isCustom&&(
                  <input value={customText[cat.key]||''}
                    onChange={e=>setCustomText(prev=>({...prev,[cat.key]:e.target.value}))}
                    placeholder={`输入自定义${cat.label}描述...`}
                    autoFocus
                    style={{padding:'8px 12px',borderRadius:8,border:`1.5px solid ${cat.color}50`,background:cat.color+'04',fontSize:13,
                      color:'var(--text)',outline:'none',fontFamily:'inherit',marginTop:2,letterSpacing:'-.01em'}}
                    onFocus={e=>e.target.style.boxShadow=`0 0 0 3px ${cat.color}12`}
                    onBlur={e=>e.target.style.boxShadow='none'}/>
                )}
              </div>
              {ci<categories.length-1&&(
                <div style={{display:'flex',justifyContent:'center',margin:'12px 0'}}>
                  <div style={{width:2,height:20,background:'var(--border-light)',borderRadius:1}}/>
                </div>
              )}
            </div>
            );
          })}
        </div>

        {/* Right: Preview */}
        <div>
          <div className="card" style={{padding:20,position:'sticky',top:0,borderRadius:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              <ISparkle size={16} color="var(--accent)"/>
              <span style={{fontSize:15,fontWeight:600,letterSpacing:'-.02em'}}>组合预览</span>
            </div>

            {/* Module chain */}
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:18}}>
              {categories.map((cat,i)=>{
                const selId=selected[cat.key];
                const isCustom=selId===`custom_${cat.key}`;
                const block=selId&&!isCustom?cat.items.find(b=>b.id===selId):null;
                const hasContent=block||(isCustom&&customText[cat.key]?.trim());
                return(
                  <div key={cat.key} style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:22,height:22,borderRadius:'50%',background:hasContent?cat.color+'18':'var(--surface-alt)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,flexShrink:0,color:hasContent?cat.color:'var(--text-3)',fontWeight:600}}>{i+1}</div>
                    <div style={{padding:'6px 12px',borderRadius:6,flex:1,fontSize:12.5,
                      background:hasContent?cat.color+'06':'var(--bg)',border:`1px solid ${hasContent?cat.color+'20':'rgba(0,0,0,0.04)'}`,
                      color:hasContent?'var(--text)':'var(--text-3)',fontWeight:hasContent?500:400,letterSpacing:'-.01em'}}>
                      {isCustom&&customText[cat.key]?.trim()?`✏️ ${customText[cat.key].trim()}`:block?`${block.emoji} ${block.text}`:`选择${cat.label}模块...`}
                    </div>
                    {i<categories.length-1&&<span style={{color:'var(--text-3)',fontSize:13,flexShrink:0,opacity:.5}}>+</span>}
                  </div>
                );
              })}
            </div>

            {/* Generated Prompt (raw combination) */}
            <div style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:'.1px'}}>基础组合</div>
                <button onClick={()=>generated&&copyText(generated,setCopiedOpt)} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:copiedOpt?'var(--emerald)':'var(--accent)',fontWeight:500}}>
                  {copiedOpt?<ICheck size={12}/>:<ICopy size={12}/>} {copiedOpt?'已复制':'复制'}
                </button>
              </div>
              <div style={{padding:12,background:'var(--bg)',borderRadius:8,fontSize:12.5,lineHeight:1.7,minHeight:50,
                color:generated?'var(--text-2)':'var(--text-3)',border:'1px solid rgba(0,0,0,0.04)'}}>
                {generated||'在左侧选择模块或输入自定义描述...'}
              </div>
            </div>

            {/* AI Optimize Button */}
            <div style={{marginBottom:14}}>
              <button onClick={handleOptimize} disabled={!generated||optimizing}
                style={{width:'100%',padding:'10px 18px',borderRadius:8,fontSize:13,fontWeight:600,cursor:!generated||optimizing?'not-allowed':'pointer',transition:'all .2s ease',
                  background:!generated?'rgba(0,0,0,.04)':optimizing?'linear-gradient(135deg,#007AFF,#5856D6)':'linear-gradient(135deg,#007AFF,#5856D6)',
                  color:!generated?'var(--text-3)':'#fff',border:'none',display:'flex',alignItems:'center',justifyContent:'center',gap:7,
                  boxShadow:!generated?'none':'0 2px 8px rgba(0,122,255,.25)',
                  transform:optimizing?'scale(.98)':'none',letterSpacing:'-.01em'}}
                onMouseEnter={e=>{if(generated&&!optimizing)e.currentTarget.style.boxShadow='0 4px 12px rgba(0,122,255,.3)'}}
                onMouseLeave={e=>{if(!optimizing)e.currentTarget.style.boxShadow=generated?'0 2px 8px rgba(0,122,255,.25)':'none'}}>
                {optimizing?(

                  color:'var(--text)',border:'1px solid var(--accent-border)'}}>

              <button className="btn-ghost" style={{display:'flex',alignItems:'center',gap:5}}

                模块顺序会影响生成效果。一般建议：主体 → 环境 → 风格 → 镜头 → 参数。
                越重要的描述放在越前面。也可以点击"自定义输入"自由填写描述内容。

};

    <div className="anim-up" style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:40}}>
